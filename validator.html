<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Polityka bezpieczeństwa treści. Narzędzie jest w całości inline i nie pobiera
     niczego z sieci, więc default-src 'none' blokuje wszystko, a wyjątki dotyczą
     wyłącznie własnego skryptu i stylu. Brak connect-src oznacza, że fetch,
     XMLHttpRequest, WebSocket, EventSource i sendBeacon są odcięte przez default-src.
     Wczytywanie plików przez input[type=file] i FileReader jest operacją lokalną,
     której CSP nie dotyczy — polityki nie osłabiamy na zapas.
     frame-ancestors celowo pominięte: w znaczniku meta jest ignorowane przez
     przeglądarki, a GitHub Pages nie pozwala ustawić nagłówka HTTP. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Rackpathlabs — multinode inventory validator (Kolla-Ansible)</title>
<meta name="description" content="Validator for a Kolla-Ansible multinode inventory: groups, duplicates, empty groups. Runs offline, with no external dependencies.">
<style>
/* == KOLLA-THEME BEGIN — generowane z theme.css, nie edytuj w miejscu == */
:root{
  --bg:#0e1318; --panel:#151b22; --panel-2:#1b232c; --line:#26313c;
  --fg:#e6edf3; --muted:#8b98a5; --dim:#87939f;
  --accent:#3ddc97; --accent-dim:#1f7f58;
  --blue:#5aa9ff; --amber:#e8b339; --red:#ef6a6a;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono","Cascadia Mono",Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:8px;
}
/* == KOLLA-THEME END == */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px 64px}

header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,#131a21,#0e1318)}
.hdr{max-width:1320px;margin:0 auto;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;font-weight:650;letter-spacing:.2px}
.logo{width:26px;height:26px;flex:0 0 26px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.3px}
nav{margin-left:auto;display:flex;gap:6px}
nav a{color:var(--muted);text-decoration:none;font-size:13.5px;padding:6px 12px;border:1px solid transparent;border-radius:var(--r)}
nav a:hover{color:var(--fg);background:var(--panel-2)}
nav a[aria-current="page"]{color:var(--fg);border-color:var(--line);background:var(--panel)}

.skip{
  position:absolute;left:-9999px;top:0;background:var(--panel-2);color:var(--fg);
  padding:9px 14px;border:1px solid var(--accent-dim);border-radius:var(--r);z-index:60
}
.skip:focus{left:12px;top:12px}

h1{font-size:20px;margin:26px 0 4px;font-weight:600;letter-spacing:-.2px}
.lede{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:82ch}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1040px){.cols{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel>h2{margin:0;padding:12px 16px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel>h2 .sp{margin-left:auto}
.panel .body{padding:16px}
.panel+.panel{margin-top:18px}

/* ---------- editor ---------- */
.tools{display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.tools .sp{margin-left:auto}
.rel{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.rel select{
  background:#0c1116;color:var(--fg);border:1px solid var(--line);border-radius:var(--r);
  padding:6px 8px;font:13px/1.3 var(--mono);cursor:pointer
}
.rel select:focus-visible{outline:none;border-color:var(--accent-dim);box-shadow:0 0 0 3px rgba(61,220,151,.14)}
textarea.plain{
  width:100%;min-height:120px;padding:10px 12px;background:#0c1116;color:var(--fg);resize:vertical;
  border:0;border-top:1px solid var(--line);font:12.5px/1.6 var(--mono);display:block
}
textarea.plain:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent-dim)}
textarea.plain.drag{box-shadow:inset 0 0 0 2px var(--accent-dim)}
.scope-note{
  padding:10px 12px;border-top:1px solid var(--line);background:#141b22;
  font-size:12.5px;color:var(--muted);line-height:1.5
}
.scope-note strong{color:var(--fg);font-weight:600}
.src{
  font:10px/1.7 var(--mono);font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:0 6px;border-radius:4px;background:#1d2630;color:var(--dim);border:1px solid var(--line)
}
.src.globals{color:var(--blue);border-color:#274058}
.src.cross{color:var(--accent);border-color:var(--accent-dim)}
.src.upgrade{color:var(--amber);border-color:#5a4a1e}
.ack-row{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.ack-row input{margin-top:3px;flex:0 0 auto}
.ack-row .t-txt{font-size:12.5px;color:var(--muted);line-height:1.45}
.ack-row .t-txt b{color:var(--fg);font-weight:600;display:block}
.editor{display:flex;position:relative;background:#0c1116}
.editor.drag{outline:2px dashed var(--accent-dim);outline-offset:-4px}
.gutter{
  flex:0 0 54px;padding:12px 10px 12px 0;text-align:right;overflow:hidden;
  font:13px/1.62 var(--mono);color:#6b7885;user-select:none;-webkit-user-select:none;
  border-right:1px solid var(--line);background:#0a0e12
}
.gutter span{display:block;white-space:pre}
.gutter span.g-err{color:var(--red);font-weight:700}
.gutter span.g-warn{color:var(--amber);font-weight:700}
textarea#src{
  flex:1;min-width:0;border:0;background:transparent;color:var(--fg);resize:vertical;
  padding:12px;font:13px/1.62 var(--mono);white-space:pre;overflow-x:auto;height:460px;tab-size:4
}
textarea#src:focus{outline:none}

/* ---------- buttons ---------- */
button{font:inherit;font-size:13.5px;font-weight:550;color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:7px 14px;cursor:pointer;transition:background .12s,border-color .12s}
button:hover:not(:disabled){background:#232d38;border-color:#33404d}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--accent-dim);border-color:#2a9c6c;color:#eafff5}
button.primary:hover:not(:disabled){background:#248f63;border-color:#3ddc97}
button.ghost{background:transparent}
button:focus-visible,a:focus-visible{outline:none;border-color:var(--accent-dim);box-shadow:0 0 0 3px rgba(61,220,151,.14)}
.small{font-size:12.5px;padding:5px 10px}

/* ---------- verdict ---------- */
.verdict{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel-2);font-size:14px}
.verdict .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px;background:var(--accent)}
.verdict.err{border-color:#5c2b2b;background:#241618}
.verdict.err .dot{background:var(--red)}
.verdict.warn{border-color:#5a4a1e;background:#221d12}
.verdict.warn .dot{background:var(--amber)}
.counts{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.chip{font:11px/1.8 var(--mono);font-weight:700;letter-spacing:.5px;padding:0 8px;border-radius:5px;background:#222b34;color:var(--muted)}
.chip.e{background:rgba(239,106,106,.14);color:var(--red)}
.chip.w{background:rgba(232,179,57,.14);color:var(--amber)}
.chip.i{background:rgba(90,169,255,.13);color:var(--blue)}

/* ---------- findings ---------- */
ul.findings{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
ul.findings:empty{display:none}
ul.findings li{display:flex;gap:10px;align-items:flex-start;padding:8px 9px;border-radius:var(--r);border:1px solid transparent}
ul.findings li:hover{background:var(--panel-2);border-color:var(--line)}
.sev{flex:0 0 auto;font:10.5px/1.7 var(--mono);font-weight:700;letter-spacing:.6px;padding:0 6px;border-radius:4px;text-transform:uppercase;margin-top:2px}
.sev.error{background:rgba(239,106,106,.14);color:var(--red)}
.sev.warn{background:rgba(232,179,57,.14);color:var(--amber)}
.sev.info{background:rgba(90,169,255,.13);color:var(--blue)}
.f-body{min-width:0;flex:1}
.f-msg{font-size:13.5px;line-height:1.5;color:#d3dde5}
.f-meta{margin-top:3px;font:11.5px var(--mono);color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
.f-line{color:var(--blue);background:none;border:0;padding:0;font:11.5px var(--mono);cursor:pointer;text-decoration:underline dotted}
.f-line:hover{color:#8cc4ff}
.f-hint{margin-top:4px;font-size:12.5px;color:var(--dim);line-height:1.45}
.empty-state{color:var(--dim);font-size:13.5px;padding:2px;margin:0}

code{font:12.5px var(--mono);background:#0c1116;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:#d6e2ec}

/* ---------- topology ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
th.num,td.num{text-align:right;padding-right:0;width:1%;white-space:nowrap}
td{padding:8px 10px 8px 0;border-bottom:1px solid #1e2731;vertical-align:top}
tr:last-child td{border-bottom:0}
td.g{font:13px var(--mono);white-space:nowrap}
.tag{font:9.5px/1.7 var(--mono);font-weight:700;letter-spacing:.5px;padding:0 5px;border-radius:4px;margin-left:7px;vertical-align:1px}
.tag.req{background:rgba(61,220,151,.12);color:var(--accent)}
.tag.cust{background:#2b353f;color:#9aa7b3}
.tag.impl{background:rgba(90,169,255,.13);color:var(--blue)}
.hostlist{font:12px var(--mono);color:var(--muted);line-height:1.6;word-break:break-all}
.count-0{color:var(--red)}
.missing{color:var(--red)}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);background:var(--panel-2);border:1px solid var(--accent-dim);color:var(--fg);padding:9px 16px;border-radius:var(--r);font-size:13.5px;box-shadow:0 8px 26px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.alert{border-color:#8a5b1e}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>

<a class="skip" href="#main" data-i18n="nav.skip">Skip to content</a>

<header>
  <div class="hdr">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="3.5" width="19" height="5" rx="1.6" stroke="#3ddc97" stroke-width="1.5"/>
        <rect x="2.5" y="15.5" width="19" height="5" rx="1.6" stroke="#3ddc97" stroke-width="1.5"/>
        <path d="M6 8.5v7M18 8.5v7" stroke="#5aa9ff" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="6" cy="6" r="1" fill="#3ddc97"/><circle cx="6" cy="18" r="1" fill="#3ddc97"/>
      </svg>
      <span>Rackpathlabs<small data-i18n="brand.sub">OpenStack tooling</small></span>
    </div>
    <nav id="nav" aria-label="Tools">
      <a href="index.html" data-i18n="nav.start">start</a>
      <a href="generator.html" data-i18n="nav.generator">globals.yml</a>
      <a href="validator.html" aria-current="page" data-i18n="nav.validator">inventory validator</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main">
  <h1 data-i18n="v.h1"></h1>
  <p class="lede" data-i18n="v.lede"></p>

  <div class="cols">

    <!-- ============ INPUT ============ -->
    <div>
      <div class="panel">
        <div class="tools">
          <button type="button" class="small" id="btn-file" data-i18n="v.btn.file"></button>
          <button type="button" class="small ghost" id="btn-sample-ok" data-i18n="v.btn.sampleOk"></button>
          <button type="button" class="small ghost" id="btn-sample-bad" data-i18n="v.btn.sampleBad"></button>
          <span class="sp"></span>
          <!-- pozycje pochodzą z macierzy wydań (KOLLA_MATRIX), nie z tego znacznika -->
          <label class="rel" for="release"><span data-i18n="v.release.label"></span>
            <select id="release" data-i18n-title="v.release.title"></select>
          </label>
          <label class="rel" for="release_to"><span data-i18n="v.releaseTo.label"></span>
            <select id="release_to" data-i18n-title="v.releaseTo.title"></select>
          </label>
          <button type="button" class="small ghost" id="btn-clear" data-i18n="v.btn.clear"></button>
          <input type="file" id="file" accept=".ini,.yml,.yaml,.txt,text/plain" class="sr" aria-hidden="true" tabindex="-1">
        </div>
        <div class="editor" id="editor">
          <div class="gutter" id="gutter" aria-hidden="true"></div>
          <textarea id="src" spellcheck="false" autocapitalize="off" autocomplete="off"
            data-i18n-ph="v.editor.placeholder"
            data-i18n-label="v.editor.label"></textarea>
        </div>
      </div>

      <div class="panel" style="margin-top:18px">
        <h2><span data-i18n="v.globals.h"></span>
          <span class="sp"></span>
          <span class="chip" id="chip-globals"></span>
        </h2>
        <div class="tools">
          <button type="button" class="small" id="btn-gfile" data-i18n="v.btn.file"></button>
          <button type="button" class="small ghost" id="btn-gclear" disabled data-i18n="v.btn.clear"></button>
          <input type="file" id="gfile" accept=".yml,.yaml,.txt,text/plain" class="sr" aria-hidden="true" tabindex="-1">
        </div>
        <textarea id="gsrc" class="plain" spellcheck="false" autocapitalize="off" autocomplete="off"
          data-i18n-label="v.globals.label"
          data-i18n-ph="v.globals.placeholder"></textarea>
        <label class="ack-row" for="ack_nobmc">
          <input type="checkbox" id="ack_nobmc">
          <span class="t-txt"><b data-i18n="v.ack.nobmc.h"></b><span data-i18n="v.ack.nobmc.p"></span></span>
        </label>
        <div class="scope-note" id="gscope" hidden data-i18n="v.scope.note"></div>
      </div>

      <div class="panel" style="margin-top:18px">
        <h2><span data-i18n="v.topology"></span>
          <span class="sp"></span>
          <span class="chip" id="chip-hosts">0 hostów</span>
        </h2>
        <div class="body" id="topology"></div>
      </div>
    </div>

    <!-- ============ RESULTS ============ -->
    <div>
      <div class="panel">
        <h2><span data-i18n="v.result"></span>
          <span class="sp"></span>
          <button type="button" class="small ghost" id="btn-report" disabled data-i18n="v.btn.report"></button>
        </h2>
        <div class="body">
          <div class="verdict" id="verdict" role="status" aria-live="polite">
            <span class="dot"></span>
            <span id="verdict-txt"></span>
            <span class="counts" id="counts"></span>
          </div>
          <ul class="findings" id="findings"></ul>
        </div>
      </div>
    </div>

  </div>

  <footer data-i18n="v.footer"></footer>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* == KOLLA-MATRIX BEGIN — generowane z matrix.js, nie edytuj w miejscu == */
  /* Jedna tabela konsumowana przez oba narzędzia. Dodanie wydania = dopisanie
     wpisu do releases[] — bez zmian w logice.

     status:      development | maintained | unmaintained | eol
     kolla:       seria kolla-ansible odpowiadająca wydaniu (null = gałąź rozwojowa)
     baseDistros: dopuszczalne wartości kolla_base_distro (null = brak danych, wydanie
                  poza wsparciem — narzędzie nie zgaduje)
     unpublished: distro dopuszczalne w konfiguracji, ale bez publikowanych obrazów
     hostOs:      systemy hosta wspierane przez to wydanie (informacyjnie)
     released:    data wydania; null, jeśli jeszcze nie wydane
     expected:    planowana data wydania — wyłącznie dla status 'development'
     endsOn:      data zmiany statusu wsparcia: dla 'maintained' planowana, dla
                  'unmaintained' i 'eol' ta, w której nastąpiła; dla 'development'
                  null — wydanie, które się nie ukazało, nie ma kiedy przestać być
                  wspierane
     defaults:    domyślne wartości istotne dla decyzji wdrożeniowych; opis klucza
                  leży w keys[] — jeden opis na klucz, nie na wydanie
     deprecationsCatalogued:
                  czy deprecacje tego wydania zostały przejrzane w release notes.
                  false NIE znaczy "nic się nie zmieniło" — znaczy "nie wiemy".
                  Ścieżka aktualizacji przez takie wydanie zgłasza jawną lukę
                  zamiast milczeć, bo pusta lista wygląda identycznie jak brak zmian.
     deprecated:  { kind: 'key'|'group'|'service'|'procedure', name, replacedBy, sev, note }
                  kind 'key' konsumuje generator, 'group'/'service' — walidator;
                  'procedure' oznacza zmianę wymagającą kroku operacyjnego, a nie
                  edycji pliku — narzędzie ma o niej powiedzieć, nie udawać, że
                  wystarczy poprawka w YAML-u;
                  sev ('error'|'warn'|'info') jest w danych, bo waga zależy od wpisu:
                  przemianowana grupa to błąd, usunięta usługa to uwaga, zmiana grupy
                  nadrzędnej to informacja */
  var KOLLA_MATRIX = {
    schema: 1,
    updated: "2026-08-10",

    /* Opis klucza żyje tu raz, nie przy każdym wydaniu.
       notable: klucz dotyczy każdego wdrożenia i narzędzie wspomina o nim zawsze.
                false = klucz ma sens dopiero przy włączonej konkretnej usłudze,
                więc czeka na przełączniki enable_* (issue #6).
       sev:     waga wpisu, gdy plik nie ustawia klucza jawnie. 'warn' zarezerwowane
                dla wartości domyślnych, które działają, ale niosą ryzyko przy skali;
                'info' dla zmian wartości bez ryzyka. */
    keys: {
      om_enable_rabbitmq_stream_fanout: {
        notable: true, sev: "warn",
        label: "RabbitMQ stream fanout queues",
        why: "With the default of <code>true</code>, every stream leader can end up on one " +
             "broker. On three control nodes it is worth checking how the leaders are " +
             "distributed once the deployment is up."
      },
      om_rabbitmq_qos_prefetch_count: {
        notable: true, sev: "info",
        label: "RabbitMQ QoS prefetch",
        why: "From 2026.1 the default is 50 rather than unlimited, which changes how work " +
             "spreads across the workers."
      },
      enable_ironic_inspector: {
        notable: false,
        label: "Ironic Inspector",
        why: "The project is retired; disabled by default from 2025.1 and slated for removal."
      },
      enable_ironic_neutron_agent: {
        notable: false,
        label: "Neutron agent for Ironic",
        why: "Disabled by default from 2025.1."
      }
    },

    releases: [
      {
        id: "2026.2", name: "Hibiscus", kolla: null, status: "development",
        released: null, expected: "2026-09-30", endsOn: null,
        baseDistros: null, unpublished: [], hostOs: [],
        defaults: {},
        deprecationsCatalogued: false,
        deprecated: []
      },
      {
        id: "2026.1", name: "Gazpacho", kolla: "22.x", status: "maintained",
        released: "2026-04-01", expected: null, endsOn: "2027-10-27",
        baseDistros: ["centos", "debian", "rocky", "ubuntu"],
        unpublished: ["centos"],
        hostOs: ["CentOS Stream 10", "Debian Trixie (13)", "Rocky Linux 10", "Ubuntu Noble (24.04)"],
        defaults: {
          om_enable_rabbitmq_stream_fanout: true,
          om_rabbitmq_qos_prefetch_count: 50
        },
        deprecationsCatalogued: true,
        deprecated: [
          { kind: "group", name: "kolla-toolbox", replacedBy: "kolla_toolbox", sev: "error",
            note: "Group and role renamed, hyphen to underscore. The old name is not recognised." },
          { kind: "service", name: "zun", replacedBy: null, sev: "warn",
            note: "Removed in 2026.1; it had stopped working." },
          { kind: "service", name: "kuryr", replacedBy: null, sev: "warn",
            note: "Removed along with Zun, its only consumer." },
          { kind: "service", name: "influxdb", replacedBy: null, sev: "warn",
            note: "Removed: InfluxDB v1 reached end of life and no migration to v2 was planned." },
          { kind: "service", name: "telegraf", replacedBy: null, sev: "warn",
            note: "Removed after an earlier deprecation." },
          { kind: "service", name: "venus", replacedBy: null, sev: "warn",

     mappingiem klucz: wartość z komentarzami, z kilkoma wyjątkami, które faktycznie

    function splitLines(text) {
      var parts = String(text == null ? "" : text).split(/(\r\n|\n|\r)/);
      var lines = [], seps = [];
      for (var i = 0; i < parts.length; i += 2) {

    /* Komentarzem jest '#' na początku linii albo poprzedzony białym znakiem.
       Wewnątrz cudzysłowów '#' jest zwykłym znakiem. */

      var quote = null;
      for (var i = 0; i < s.length; i++) {
        var ch = s.charAt(i);

          if (ch === quote) quote = null;
        } else if (ch === '"' || ch === "'") {

          return { body: s.slice(0, i), comment: s.slice(i) };
        }

    }

          .replace(/\\n/g, "\n").replace(/\\t/g, "\t")

        return s.slice(1, -1).replace(/''/g, "'");
