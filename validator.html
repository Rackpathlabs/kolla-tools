    "hacluster,loadbalancer,haproxy,keepalived,mariadb,memcached,rabbitmq,redis,proxysql," +
    "keystone,glance,nova,nova-api,neutron,neutron-server,cinder,cinder-api," +
    "cinder-volume,cinder-backup,cinder-volume-lvm,cinder-volume-multiple," +
    "cinder-backup-lvm,cinder-backup-multiple,horizon,heat,placement,swift,ironic,magnum,octavia," +
    "designate,barbican,manila,trove,masakari,ceilometer,gnocchi,aodh,cloudkitty," +
    "watcher,zun,blazar,cyborg,tacker,venus,skyline,opensearch,openvswitch," +
    "ovn-database,ovn-controller,ovn-controller-compute,ovn-controller-network," +
    "ovn-nb-db,ovn-sb-db,ovn-sb-db-relay,ovn-northd,ceph-mon," +
    "iscsid,tgtd,multipathd,external-compute,external-ceph"
  ).split(",");

  /* Grupy usunięte w którymkolwiek wydaniu też są nazwami Kolli — po prostu już
     nieobsługiwanymi. Bez tego wykrywanie literówek zgłaszałoby je jako nieznane
     obok wpisu o wycofaniu, czyli dwa razy o tej samej rzeczy, z czego raz
     nieprawdziwie. Lista bierze się z macierzy, nie z drugiego wykazu. */
  KOLLA_MATRIX.releases.forEach(function (r) {
    r.deprecated.forEach(function (d) {
      if (d.kind !== "group" && d.kind !== "service") return;
      if (KNOWN.indexOf(d.name) === -1) KNOWN.push(d.name);
      if (d.replacedBy && KNOWN.indexOf(d.replacedBy) === -1) KNOWN.push(d.replacedBy);
    });
  });

  var el = {
    src: document.getElementById("src"),
    gutter: document.getElementById("gutter"),
    editor: document.getElementById("editor"),
    findings: document.getElementById("findings"),
    verdict: document.getElementById("verdict"),
    verdictTxt: document.getElementById("verdict-txt"),
    counts: document.getElementById("counts"),
    topology: document.getElementById("topology"),
    chipHosts: document.getElementById("chip-hosts"),
    toast: document.getElementById("toast"),
    file: document.getElementById("file"),
    btnReport: document.getElementById("btn-report"),
    release: document.getElementById("release"),
    releaseTo: document.getElementById("release_to"),
    gsrc: document.getElementById("gsrc"),
    gfile: document.getElementById("gfile"),
    gscope: document.getElementById("gscope"),
    chipGlobals: document.getElementById("chip-globals"),
    btnGclear: document.getElementById("btn-gclear"),
    ackNoBmc: document.getElementById("ack_nobmc")
  };

  var lastReport = null;

  /* ================================================================== */
  /* parser                                                              */
  /* ================================================================== */

  /* Ansible używa shlex.split(comments=True): komentarzem w środku linii jest
     wyłącznie '#'. Średnik jest komentarzem tylko na początku linii. */
  function stripComment(line) {
    if (/^\s*[;#]/.test(line)) return "";
    var out = "";
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (ch === "#" && (i === 0 || /\s/.test(line.charAt(i - 1)))) break;
      out += ch;
    }
    return out;
  }

  /* tokenizacja z poszanowaniem cudzysłowów: host key="a b" other=1 */
  function tokenize(line) {
    var tokens = [], buf = "", quote = null;
    for (var i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (quote) {
        if (ch === quote) quote = null; else buf += ch;
      } else if (ch === '"' || ch === "'") {
        quote = ch;
      } else if (/\s/.test(ch)) {
        if (buf) { tokens.push(buf); buf = ""; }
      } else {
        buf += ch;
      }
    }
    if (buf) tokens.push(buf);
    return tokens;
  }

  /* Rozwinięcie wzorca zakresu zgodnie z zachowaniem Ansible: rozwijana jest
     wyłącznie PIERWSZA para nawiasów, końce muszą być tej samej klasy, a przy
     wiodącym zerze — tej samej długości. Zwraca null dla wzorca, który Ansible
     odrzuci, żeby walidator nie pokazywał topologii niemożliwej do wczytania. */
  function expandPattern(head, limit) {
    var m = /\[([0-9]+|[a-zA-Z]):([0-9]+|[a-zA-Z])(?::([0-9]+))?\]/.exec(head);
    if (!m) return null;

    var step = m[3] ? parseInt(m[3], 10) : 1;
    if (!step || step < 1) return null;

    var items = [];
    if (/^[0-9]+$/.test(m[1]) && /^[0-9]+$/.test(m[2])) {
      var padded = m[1].charAt(0) === "0" || m[2].charAt(0) === "0";
      if (padded && m[1].length !== m[2].length) return null;
      var from = parseInt(m[1], 10), to = parseInt(m[2], 10);
      if (to < from) return null;
      if ((to - from) / step + 1 > limit) return null;
      for (var n = from; n <= to; n += step) {
        var v = String(n);
        while (padded && v.length < m[1].length) v = "0" + v;
        items.push(v);
      }
    } else if ((/^[a-z]$/.test(m[1]) && /^[a-z]$/.test(m[2])) ||
               (/^[A-Z]$/.test(m[1]) && /^[A-Z]$/.test(m[2]))) {
      var a = m[1].charCodeAt(0), b = m[2].charCodeAt(0);
      if (b < a) return null;
      for (var c = a; c <= b; c += step) items.push(String.fromCharCode(c));
    } else {
      return null;
    }

    var prefix = head.slice(0, m.index);
    var suffix = head.slice(m.index + m[0].length);
    return items.map(function (x) { return prefix + x + suffix; });
  }

  function newGroup(name) {
    return {
      name: name,
      declaredAt: [],     // linie z [name]
      varsAt: [],         // linie z [name:vars]
      childrenAt: [],     // linie z [name:children]
      referencedAt: [],   // linie, w których grupa wystąpiła jako dziecko
      hosts: [],          // { name, line, vars }
      children: [],       // { name, line }
      vars: []            // { key, value, line }
    };
  }

  function parse(text) {
    var lines = text.split(/\r?\n/);
    var groups = Object.create(null);
    var order = [];
    var findings = [];
    var current = null;   // { group, kind: 'hosts'|'vars'|'children' }
    var hostBudget = MAX_HOSTS;
    var budgetHit = false;

    function group(name) {
      if (!groups[name]) { groups[name] = newGroup(name); order.push(name); }
      return groups[name];
    }

    function add(sev, code, msg, line, hint) {
      findings.push({ sev: sev, code: code, msg: msg, line: line || null, hint: hint || null });
    }

    for (var i = 0; i < lines.length; i++) {
      var lineNo = i + 1;
      var body = stripComment(lines[i]).trim();
      if (!body) continue;

      /* ---- nagłówek sekcji ---- */
      if (body.charAt(0) === "[") {
        var hm = /^\[([^\[\]]*)\]$/.exec(body);
        if (!hm) {
          add("error", "SKLADNIA", "Niepoprawny nagłówek sekcji: <code>" + esc(body) + "</code>.", lineNo,
              "Oczekiwany format to <code>[nazwa]</code>, <code>[nazwa:children]</code> lub <code>[nazwa:vars]</code>.");
          current = null;
          continue;
        }
        var inner = hm[1].trim();
        if (!inner) {
          add("error", "SKLADNIA", "Pusta nazwa grupy w nagłówku sekcji.", lineNo);
          current = null;
          continue;
        }
        var parts = inner.split(":");
        var gname = parts[0].trim();
        var kind = parts.length > 1 ? parts[1].trim().toLowerCase() : "hosts";
        if (parts.length > 2 || (kind !== "hosts" && kind !== "vars" && kind !== "children")) {
          add("error", "SKLADNIA", "Nieznany typ sekcji <code>" + esc(inner) + "</code>.", lineNo,
              "Ansible rozpoznaje wyłącznie <code>:children</code> i <code>:vars</code>.");
          current = null;
          continue;
        }
        if (!/^[A-Za-z0-9_.-]+$/.test(gname)) {
          add("error", "NAZWA-GRUPY", "Nazwa grupy <code>" + esc(gname) + "</code> zawiera niedozwolone znaki.", lineNo,
              "Dozwolone są litery, cyfry oraz <code>_ . -</code>.");
        }
        var g = group(gname);
        if (kind === "hosts") {
          if (g.declaredAt.length) {
            add("info", "SEKCJA-POWT", "Sekcja <code>[" + esc(gname) + "]</code> występuje ponownie (pierwsza w linii " +
                g.declaredAt[0] + "). Ansible scali wpisy.", lineNo);
          }
          g.declaredAt.push(lineNo);
        } else if (kind === "vars") {
          g.varsAt.push(lineNo);
        } else {
          g.childrenAt.push(lineNo);
        }
        current = { group: gname, kind: kind };
        continue;
      }

      /* ---- wpis poza sekcją ---- */
      if (!current) {
        add("error", "POZA-GRUPA", "Wpis <code>" + esc(body.split(/\s+/)[0]) + "</code> znajduje się przed jakimkolwiek nagłówkiem grupy.",
            lineNo, "Ansible przypisze go do grupy <code>ungrouped</code>, więc żadna rola Kolla go nie obejmie.");
        continue;
      }

      var tokens = tokenize(body);
      var head = tokens[0];

      /* ---- zmienne grupowe ---- */
      if (current.kind === "vars") {
        var varsReported = false;
        for (var vt = 0; vt < tokens.length; vt++) {
          var veq = tokens[vt].indexOf("=");
          if (veq < 1) {
            if (!varsReported) {
              varsReported = true;
              add("error", "ZMIENNA-GRUPY", "W sekcji <code>[" + esc(current.group) + ":vars]</code> wpis <code>" +
                  esc(body) + "</code> nie jest przypisaniem zmiennej.", lineNo,
                  "Ansible oczekuje zapisu <code>klucz=wartość</code>, bez spacji wokół znaku równości.");
            }
            continue;
          }
          groups[current.group].vars.push({ key: tokens[vt].slice(0, veq), value: tokens[vt].slice(veq + 1), line: lineNo });
        }
        continue;
      }

      /* ---- lista dzieci ---- */
      if (current.kind === "children") {
        if (tokens.length > 1) {
          add("error", "DZIECI-FORMAT", "Sekcja <code>[" + esc(current.group) + ":children]</code> może zawierać wyłącznie nazwy grup, po jednej w linii.",
              lineNo, "Znaleziono dodatkowe człony: <code>" + esc(tokens.slice(1).join(" ")) + "</code>.");
        }
        group(head).referencedAt.push(lineNo);
        groups[current.group].children.push({ name: head, line: lineNo });
        continue;
      }

      /* ---- host ---- */
      var vars = {};
      var varReported = false;
      for (var t = 1; t < tokens.length; t++) {
        var eq = tokens[t].indexOf("=");
        if (eq < 1) {
          if (!varReported) {
            varReported = true;
            add("error", "HOST-ZMIENNA", "Człon <code>" + esc(tokens[t]) + "</code> przy hoście <code>" + esc(head) +
                "</code> nie jest przypisaniem zmiennej.", lineNo,
                "Zmienne hosta zapisuje się jako <code>klucz=wartość</code>, bez spacji wokół znaku równości.");
          }
          continue;
        }
        vars[tokens[t].slice(0, eq)] = tokens[t].slice(eq + 1);
      }

      var names = [head];
      if (head.indexOf("[") !== -1 || head.indexOf("]") !== -1) {
        names = expandPattern(head, MAX_RANGE);
        if (!names) {
          add("error", "ZAKRES", "Wzorzec <code>" + esc(head) + "</code> nie jest poprawnym zakresem hostów.", lineNo,
              "Ansible wymaga zapisu <code>nazwa[01:10]</code> lub <code>nazwa[a:f]</code>, opcjonalnie z krokiem " +
              "(<code>[01:10:2]</code>). Oba końce muszą być tej samej klasy, a przy wiodącym zerze także tej samej długości.");
          names = [];
        }
      }

      if (names.length > hostBudget) {
        if (!budgetHit) {
          budgetHit = true;
          add("error", "LIMIT-HOSTOW", "Inventory przekracza limit " + MAX_HOSTS + " hostów obsługiwany przez to narzędzie.",
              lineNo, "Dalsze wpisy nie zostały przeanalizowane. Podziel plik albo sprawdź, czy zakresy nie są szersze niż zamierzone.");
        }
        names = names.slice(0, Math.max(0, hostBudget));
      }
      hostBudget -= names.length;

      for (var k = 0; k < names.length; k++) {
        groups[current.group].hosts.push({ name: names[k], line: lineNo, vars: vars });
      }
    }

    return { groups: groups, order: order, findings: findings, truncated: budgetHit };
  }

  /* ================================================================== */
  /* analiza                                                             */
  /* ================================================================== */

  function levenshtein(a, b) {
    var m = a.length, n = b.length, prev = [], cur = [], i, j;
    for (j = 0; j <= n; j++) prev[j] = j;
    for (i = 1; i <= m; i++) {
      cur[0] = i;
      for (j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));
      }
      prev = cur.slice();
    }
    return prev[n];
  }

  function detectCycle(groups, name, path, seenEdges) {
    var g = groups[name];
    if (!g) return null;
    for (var i = 0; i < g.children.length; i++) {
      var child = g.children[i].name;
      if (path.indexOf(child) !== -1) return { cycle: path.slice(path.indexOf(child)).concat(child), line: g.children[i].line };
      var key = name + ">" + child;
      if (seenEdges[key]) continue;
      seenEdges[key] = true;
      var deeper = detectCycle(groups, child, path.concat(child), seenEdges);
      if (deeper) return deeper;
    }
    return null;
  }

  /* Reguły zależne od wybranego wydania. Wydzielone z analyse(), bo ich treść
     pochodzi w całości z macierzy — dodanie wydania nie dotyka tej funkcji.
     Z macierzy bierzemy tu wyłącznie wpisy dotyczące grup i usług; klucze
     globals.yml sprawdza generator. */
  function releaseRules(release, groups) {
    var out = [];
    var rel = findRelease(release);
    if (!rel) return out;

    var st = RELEASE_STATUS[rel.status];
    if (st && st.sev) {
      var dt = st.dateField ? rel[st.dateField] : null;
      out.push({
        sev: st.sev, code: "WYDANIE",
        msg: "Wybrane wydanie <code>" + esc(rel.id) + "</code> (" + esc(rel.name) +
             (rel.kolla ? ", kolla-ansible " + esc(rel.kolla) : "") + "): " + T(st.textKey) +
             (dt ? " — " + T(st.dateLabelKey) + ": <code>" + esc(dt) + "</code>" : "") + ".",
        line: null,
        hint: "Nazwy grup sprawdzane są względem tego wydania."
      });
    }

    rel.deprecated.forEach(function (dep) {
      if (dep.kind !== "group" && dep.kind !== "service") return;
      var g = groups[dep.name];
      if (!g) return;
      out.push({
        sev: dep.sev || "warn",
        code: dep.replacedBy ? "GRUPA-PRZEMIANOWANA" : "GRUPA-WYCOFANA",
        msg: T("v.r.group", { group: esc(dep.name) }) + (dep.replacedBy
          ? T("v.r.renamed", { rel: esc(rel.id), to: esc(dep.replacedBy) })
          : T("v.r.removed", { rel: esc(rel.id) })),
        line: g.declaredAt[0] || g.childrenAt[0] || g.varsAt[0] || g.referencedAt[0] || null,
        hint: dep.note
      });
    });

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* kworum i liczebność grup (KV-02, KV-03)                             */
  /* ------------------------------------------------------------------ */

  /* Wszystkie progi w jednym miejscu — reguły niżej nie zawierają liczb. */
  var QUORUM = {
    /* Galera, kolejki quorum RabbitMQ i Corosync wymagają większości. Parzysta
       liczba węzłów nie podnosi odporności, a podwaja liczbę awarii zabijających
       kworum. */
    minOdd: 3,
    /* Klaster RAFT baz OVN: kolla przewiduje 1 albo 3. Powyżej trzech koszt
       replikacji rośnie, dostępność nie. */
    ovnMax: 3
  };

  /* Grupy niosące własne kworum. Sprawdzane osobno, bo w inventory potrafią
     dostać własną obsadę zamiast dziedziczyć z [control]. */
  var QUORUM_GROUPS = [
    { name: "control",
      label: "the control plane",
      why: "Three independent quorum mechanisms ride on this one host list: Galera, RabbitMQ quorum queues and Corosync.",
      fail: "With two nodes, losing one puts Galera into non-Primary — the database goes read-only and every write API call returns 500. With four, losing two (one rack, one switch) kills quorum even though two healthy nodes remain. It surfaces at the first real failover, or during a rolling reboot while patching." },
    { name: "mariadb",
      label: "Galera",
      why: "The group carries its own membership instead of inheriting from <code>[control]</code>.",
      fail: "Losing half the nodes puts the cluster into non-Primary — the database goes read-only." },
    { name: "rabbitmq",
      label: "RabbitMQ",
      why: "The group carries its own membership instead of inheriting from <code>[control]</code>.",
      fail: "Quorum queues need a majority. Without one, publishing blocks and RPC calls between services time out." },
    { name: "hacluster",
      label: "Corosync/Pacemaker",
      why: "The group carries its own membership instead of inheriting from <code>[control]</code>.",
      fail: "An even Corosync cluster cannot form a majority under a network partition — neither half takes over the resources." },
    { name: "etcd",
      label: "etcd",
      why: "The group carries its own membership instead of inheriting from <code>[control]</code>.",
      fail: "Without a majority etcd goes read-only — services that lose contact with it cannot persist state." }
  ];

  /* W referencyjnym inventory [ovn-nb-db] i [ovn-sb-db] dziedziczą z [ovn-database],
     więc obsadę zmienia się zwykle w tej jednej grupie. Grupy szczegółowe sprawdzamy
     tylko wtedy, gdy ktoś nadał im własną listę — inaczej ten sam błąd zgłosiłby się
     trzy razy. */
  var OVN_DB_GROUPS = [
    { name: "ovn-database", base: true,
      label: "the OVN databases" },
    { name: "ovn-nb-db",
      label: "the OVN northbound database" },
    { name: "ovn-sb-db",
      label: "the OVN southbound database" }
  ];

  function sameSet(a, b) {
    if (!a || !b || a.length !== b.length) return false;
    return a.slice().sort().join(" ") === b.slice().sort().join(" ");
  }

  function groupLine(g) {
    if (!g) return null;
    return g.declaredAt[0] || g.childrenAt[0] || g.varsAt[0] || g.referencedAt[0] || null;
  }

  /* Reguły liczebności. Wydzielone z analyse() z tego samego powodu co
     releaseRules(): trzymają własne progi i własne wyjątki. */
  function quorumRules(groups, effective, hostNames) {
    var out = [];
    var control = effective.control || [];
    var compute = effective.compute || [];

    /* Wyjątek all-in-one: jeden węzeł sterujący, który jest zarazem węzłem
       obliczeniowym, to świadomy układ laboratoryjny, a nie zepsute kworum. */
    var aio = control.length === 1 && compute.indexOf(control[0]) !== -1;

    QUORUM_GROUPS.forEach(function (spec) {
      var g = groups[spec.name];
      if (!g) return;
      var hosts = effective[spec.name] || [];
      if (!hosts.length) return;              // pustą grupę zgłasza osobna reguła
      /* grupa dziedzicząca obsadę z [control] jest już pokryta wpisem dla control */
      if (spec.name !== "control" && sameSet(hosts, control)) return;

      var n = hosts.length;
      var line = groupLine(g);

      if (n === 1) {
        if (spec.name === "control" && aio) {
          out.push({ sev: "info", code: "KWORUM-AIO",
            msg: T("v.q.aio.msg"), line: line,
            hint: T("v.q.aio.hint", { min: QUORUM.minOdd }) });
        } else {
          out.push({ sev: "error", code: "KWORUM-LICZBA",
            msg: T("v.q.single.msg", { group: esc(spec.name), label: spec.label }),
            line: line,
            hint: spec.fail + " " + T("v.q.needOdd", { min: QUORUM.minOdd }) });
        }
        return;
      }

      if (n % 2 === 0 || n < QUORUM.minOdd) {
        out.push({ sev: "error", code: "KWORUM-LICZBA",
          msg: T("v.q.count.msg", {
            group: esc(spec.name),
            count: I18N.count("n.host", n),
            reason: T(n % 2 === 0 ? "v.q.even" : "v.q.tooFew"),
            label: spec.label
          }),
          line: line,
          hint: spec.why + " " + spec.fail });
      }
    });

    /* --- klastry RAFT baz OVN --- */
    var ovnBase = groups["ovn-database"] ? (effective["ovn-database"] || []) : null;
    var nbHosts = null;
    OVN_DB_GROUPS.forEach(function (spec) {
      var g = groups[spec.name];
      if (!g) return;
      var hosts = effective[spec.name] || [];
      if (!hosts.length) return;
      if (spec.name === "ovn-nb-db") nbHosts = hosts;
      /* grupa dziedzicząca z [ovn-database] jest pokryta wpisem dla tej grupy */
      if (!spec.base && ovnBase && ovnBase.length && sameSet(hosts, ovnBase)) return;

      var n = hosts.length;
      var line = groupLine(g);

      if (n % 2 === 0 || n > QUORUM.ovnMax) {
        out.push({ sev: "error", code: "KWORUM-OVN",
          msg: "Grupa <code>[" + esc(spec.name) + "]</code> ma " +
               countLabel(n, "host", "hosty", "hostów") + " — klaster RAFT wymaga 1 albo " +
               QUORUM.ovnMax + ".",
          line: line,
          hint: "Klaster dwuwęzłowy ma gorszą dostępność niż pojedynczy węzeł: wdrożenie " +
                "przechodzi, <code>ovn-nbctl show</code> działa, ale przy utracie jednego " +
                "z dwóch węzłów RAFT traci kworum i baza przechodzi w tryb tylko do " +
                "odczytu. Neutron przestaje tworzyć porty i grupy zabezpieczeń, podczas " +
                "gdy istniejąca warstwa danych działa dalej — monitoring maszyn świeci " +
                "na zielono, a chmura jest zamrożona." });
      } else if (n === 1 && control.length > 1) {
        out.push({ sev: "info", code: "KWORUM-OVN",
          msg: T("v.q.ovnSpof.msg", {
            group: esc(spec.name), count: I18N.count("n.node", control.length)
          }),
          line: line,
          hint: T("v.q.ovnSpof.hint", { label: spec.label }) });
      }
    });

    /* northd łączy się z bazą lokalnie tylko wtedy, gdy stoi na tych samych hostach */
    var northd = groups["ovn-northd"] ? (effective["ovn-northd"] || []) : null;
    var dbRef = (nbHosts && nbHosts.length) ? nbHosts : ovnBase;
    if (northd && northd.length && dbRef && dbRef.length && !sameSet(northd, dbRef)) {
      out.push({ sev: "warn", code: "OVN-NORTHD",
        msg: "Obsada <code>[ovn-northd]</code> różni się od obsady baz OVN.",
        line: groupLine(groups["ovn-northd"]),
        hint: "northd będzie łączyć się z bazą zdalnie. Zwykle obie grupy mają tę samą " +
              "listę hostów." });
    }

    /* --- monitory Ceph --- */
    /* Kolla-Ansible nie wdraża Cepha od wydania Ussuri — obecność tej grupy zwykle
       znaczy, że inventory pochodzi sprzed tej zmiany albo z ceph-ansible/cephadm. */
    var mon = groups["ceph-mon"];
    if (mon) {
      var monHosts = effective["ceph-mon"] || [];
      var monLine = groupLine(mon);
      out.push({ sev: "info", code: "CEPH-POZA-KOLLA",
        msg: "Grupa <code>[ceph-mon]</code> nie jest wdrażana przez Kolla-Ansible.",
        line: monLine,
        hint: "Wdrażanie Cepha usunięto z Kolla-Ansible w wydaniu Ussuri. Klaster " +
              "podłącza się jako zewnętrzny (<code>external-ceph</code>), a tę grupę " +
              "obsługuje ceph-ansible albo cephadm — Kolla ją zignoruje." });
      if (monHosts.length && (monHosts.length % 2 === 0 || monHosts.length < QUORUM.minOdd)) {
        out.push({ sev: monHosts.length === 1 ? "info" : "warn", code: "KWORUM-CEPH",
          msg: T("v.q.ceph.msg", {
            count: I18N.count("n.host", monHosts.length), min: QUORUM.minOdd
          }),
          line: monLine,
          hint: "Bez większości monitorów klaster wstrzymuje operacje wejścia-wyjścia. " +
                "Przy dwóch monitorach utrata jednego zatrzymuje cały magazyn." });
      }
    }

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* kolokacja ról (KV-04, KV-11)                                        */
  /* ------------------------------------------------------------------ */

  /* Progi kolokacji — reguły niżej nie zawierają liczb. */
  var COLLOCATION = {
    /* poniżej tylu węzłów w [network] nie ma przełączania bramy OVN */
    minGateway: 2,
    /* od tylu węzłów obliczeniowych brak redundancji bramy zaczyna boleć */
    computeScale: 2,
    /* ilu hostów wymieniamy w treści wpisu, zanim przejdziemy na wielokropek */
    listLimit: 6
  };

  function intersect(a, b) {
    var set = Object.create(null);
    (b || []).forEach(function (h) { set[h] = 1; });
    return (a || []).filter(function (h) { return set[h]; });
  }

  function hostList(names) {
    var shown = names.slice(0, COLLOCATION.listLimit)
      .map(function (n) { return "<code>" + esc(n) + "</code>"; }).join(", ");
    return names.length > COLLOCATION.listLimit
      ? shown + " i " + (names.length - COLLOCATION.listLimit) + " więcej" : shown;
  }

  function collocationRules(groups, effective, hostNames, flags) {
    flags = flags || Object.create(null);
    var out = [];
    var control = effective.control || [];
    var compute = effective.compute || [];
    var network = effective.network || [];
    var storage = effective.storage || [];

    /* All-in-one to jeden host w całym inventory — tam kolokacja jest całą
       konstrukcją, nie usterką. Osobny wpis informacyjny wystawia reguła kworum. */
    var aio = hostNames.length === 1;

    /* --- KV-04: [control] i [compute] rozłączne --- */
    /* Uwaga, nie błąd, dopóki globals.yml nie dowiedzie warunku eskalacji.
       Kolokacja bez Masakari to poprawny układ hiperkonwergentny małego klastra —
       "Not a bug when" z rulesetu jest częścią reguły, nie przypisem do niej. */
    var ctlCmp = intersect(control, compute);
    if (ctlCmp.length && !aio) {
      var v4 = lintVariantB("KV-04", flags);
      out.push({
        sev: lintSevB("KV-04", v4, null), code: "KOLOKACJA-CONTROL-COMPUTE",
        msg: T("v.c.ctlcmp.msg", {
          n: I18N.plural("v.c.n.hostServes", ctlCmp.length).replace("{n}", ctlCmp.length),
          hosts: hostList(ctlCmp)
        }),
        line: groupLine(groups.compute),
        hint: (v4 === "ha" ? T("v.c.ctlcmp.escalated") : "") + T("v.c.ctlcmp.hint") +
              (v4 === "ha" ? "" : T("v.c.ctlcmp.needGlobals"))
      });
    }

    /* --- KV-11: [network] pod OVN --- */
    if (network.length) {
      var sameAsControl = control.length && sameSet(network, control);
      var ctlNet = intersect(network, control);

      if (sameAsControl) {
        out.push({
          sev: "warn", code: "KOLOKACJA-NETWORK",
          msg: T("v.c.net.same.msg"),
          line: groupLine(groups.network),
          hint: T("v.c.net.same.hint")
        });
      } else if (ctlNet.length) {
        out.push({
          sev: "warn", code: "KOLOKACJA-NETWORK",
          msg: T("v.c.net.partial.msg", { hosts: hostList(ctlNet) }),
          line: groupLine(groups.network),
          hint: T("v.c.net.partial.hint")
        });
      }

      if (network.length < COLLOCATION.minGateway &&
          compute.length >= COLLOCATION.computeScale) {
        out.push({
          sev: "warn", code: "BRAMA-BEZ-HA",
          msg: T("v.c.gw.msg", {
            count: I18N.count("n.host", network.length),
            computeCount: I18N.count("n.computeNode", compute.length)
          }),
          line: groupLine(groups.network),
          hint: T("v.c.gw.hint", { min: COLLOCATION.minGateway })
        });
      }
    }

    /* --- [storage] razem z [compute] --- */
    var stgCmp = intersect(storage, compute);
    if (stgCmp.length && !aio) {
      out.push({
        sev: "info", code: "KOLOKACJA-STORAGE",
        msg: T("v.c.storage.msg", {
          n: I18N.plural("v.c.n.hostCombines", stgCmp.length).replace("{n}", stgCmp.length),
          hosts: hostList(stgCmp)
        }),
        line: groupLine(groups.storage),
        hint: T("v.c.storage.hint")
      });
    }

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* reguły wymagające obu plików (KV-01, KV-07, KV-09) + eskalacja KV-04 */
  /* ------------------------------------------------------------------ */

  /* Ten sam kształt co LINT w generatorze (#25): warianty wagi w danych, drabina
     eskalacji w `by`, potwierdzenie obniża do informacji. Powtórzony jest wyłącznie
     kilkunastolinijkowy wybierak wariantu — reguły i ich treść nie. */
  var LINT_B = {
    "KV-01": { ack: "ack_nobmc", sev: { plain: "error" }, by: [[null, "plain"]] },
    /* Amendment KV-04: tryb łączony widzi warunek eskalacji, więc może podnieść wagę.
       Bez tych kluczy zostaje uwaga — dokładnie tyle, ile udowadnia samo inventory. */
    "KV-04": { ack: null, sev: { ha: "error", plain: "warn" },
               by: [["enable_masakari", "ha"], ["enable_hacluster", "ha"],
                    ["enable_pacemaker_remote", "ha"], [null, "plain"]] },
    "KV-07": { ack: null, sev: { missing: "error" }, by: [[null, "missing"]] },
    "KV-09": { ack: null, sev: { collision: "error", subnet: "warn" } }
  };

  function lintVariantB(id, flags) {
    var by = LINT_B[id].by || [];
    for (var i = 0; i < by.length; i++) {
      if (by[i][0] === null || flags[by[i][0]]) return by[i][1];
    }
    return null;
  }

  function lintSevB(id, variant, acks) {
    var r = LINT_B[id];
    if (r.ack && acks && acks[r.ack]) return "info";
    return r.sev[variant];
  }

  function yamlTruthy(v) {
    var s = String(v == null ? "" : v).trim().toLowerCase();
    return s === "yes" || s === "true" || s === "on" || s === "1";
  }

  /* Klucz nieobecny znaczy "wartość domyślna Kolli", a ta dla haproxy i keepalived
     jest włączona. Zwolnienie z KV-09 wymaga jawnego wyłączenia, nie milczenia. */
  function explicitlyOff(glob, key) {
    var e = glob && glob.keys[key];
    if (!e) return false;
    var s = String(e.value == null ? "" : e.value).trim().toLowerCase();
    return s === "no" || s === "false" || s === "off" || s === "0";
  }

  var GLOBALS_FLAGS = ["enable_masakari", "enable_hacluster", "enable_pacemaker_remote",
                       "enable_cinder_backend_lvm", "cinder_backend_ceph"];

  function globalsFlags(glob) {
    var f = Object.create(null);
    GLOBALS_FLAGS.forEach(function (k) {
      var e = glob && glob.keys[k];
      f[k] = e ? yamlTruthy(e.value) : false;
    });
    return f;
  }

  var BMC_RE = /(^|_)(ipmi|bmc|drac|ilo|redfish)(_|$)/i;

  /* Fencing wymaga adresu kontrolera zarządzania. Szukamy go w zmiennych hostów
     i w zmiennych grup — w obu miejscach bywa deklarowany. */
  function hasBmcFields(groups, order) {
    for (var i = 0; i < order.length; i++) {
      var g = groups[order[i]];
      for (var h = 0; h < g.hosts.length; h++) {
        var vars = g.hosts[h].vars;
        for (var k in vars) if (BMC_RE.test(k)) return true;
      }
      for (var v = 0; v < g.vars.length; v++) if (BMC_RE.test(g.vars[v].key)) return true;
    }
    return false;
  }

  /* Inventory nie niesie masek, więc podsieć jest wnioskowana. Zwracamy założenie
     razem z wynikiem, bo reguła, która go nie poda, jest blefem. */
  function inferSubnet(addrs) {
    var v4 = addrs.filter(function (a) { return /^\d{1,3}(\.\d{1,3}){3}$/.test(a); });
    if (v4.length < 2) return null;
    var parts = v4.map(function (a) { return a.split("."); });
    var first = parts[0];
    if (parts.every(function (p) { return p[0] === first[0] && p[1] === first[1] && p[2] === first[2]; })) {
      return { prefix: first.slice(0, 3).join("."), mask: 24, octets: 3 };
    }
    if (parts.every(function (p) { return p[0] === first[0] && p[1] === first[1]; })) {
      return { prefix: first.slice(0, 2).join("."), mask: 16, octets: 2 };
    }
    return null;
  }

  function gline(glob, key) {
    var e = glob && glob.keys[key];
    return e ? e.line : null;
  }

  function crossRules(groups, order, effective, hostIndex, glob, acks) {
    var out = [];
    if (!glob) return out;

    /* Zgłoszenia parsera pokazujemy zawsze — także te bez wagi błędu. Reguły
       uruchamiamy dopiero na pliku, który sparsował się w całości: wnioskowanie
       z połowy pliku byłoby zgadywaniem. */
    glob.findings.forEach(function (f) {
      out.push({ sev: f.sev, code: f.code, src: "globals", line: f.line,
                 msg: f.msg, hint: f.hint || null });
    });
    if (!glob.ok) return out;

    var flags = globalsFlags(glob);

    /* --- KV-01: Masakari z hacluster, ale bez śladu fencingu --- */
    if (flags.enable_masakari && flags.enable_hacluster && !hasBmcFields(groups, order)) {
      out.push({
        sev: lintSevB("KV-01", lintVariantB("KV-01", flags), acks),
        code: "KV-01-FENCING", src: "cross", line: null,
        refs: [{ src: "globals", line: gline(glob, "enable_masakari") },
               { src: "globals", line: gline(glob, "enable_hacluster") }],
        msg: T("v.x.kv01.msg"),
        hint: T("v.x.kv01.hint")
      });
    }

    /* --- KV-07: wiele hostów magazynu bez nazwy klastra Cindera --- */
    var storage = effective.storage || [];
    var lvmOnly = flags.enable_cinder_backend_lvm && !flags.cinder_backend_ceph;
    if (storage.length > 1 && !glob.keys.cinder_cluster_name && !lvmOnly) {
      out.push({
        sev: lintSevB("KV-07", lintVariantB("KV-07", flags), acks),
        code: "KV-07-CINDER-KLASTER", src: "cross",
        line: groupLine(groups.storage),
        refs: [{ src: "inventory", line: groupLine(groups.storage) },
               { src: "globals", line: null }],
        msg: T("v.x.kv07.msg", { count: I18N.count("n.host", storage.length) }),
        hint: T("v.x.kv07.hint")
      });
    }

    /* --- KV-09: VIP kontra adresy hostów --- */
    if (!explicitlyOff(glob, "enable_haproxy") && !explicitlyOff(glob, "enable_keepalived")) {
      var byAddr = Object.create(null);
      Object.keys(hostIndex).forEach(function (host) {
        hostIndex[host].defs.forEach(function (d) {
          var a = d.vars.ansible_host;
          if (!a) return;
          if (!byAddr[a]) byAddr[a] = { hosts: [], line: d.line };
          if (byAddr[a].hosts.indexOf(host) === -1) byAddr[a].hosts.push(host);
        });
      });
      var addrList = Object.keys(byAddr);
      var net = inferSubnet(addrList);

      ["kolla_internal_vip_address", "kolla_external_vip_address"].forEach(function (key) {
        var e = glob.keys[key];
        if (!e || e.value === null || String(e.value).trim() === "") return;
        var vip = String(e.value).trim();

        if (byAddr[vip]) {
          out.push({
            sev: lintSevB("KV-09", "collision", acks),
            code: "KV-09-VIP-KOLIZJA", src: "cross", line: byAddr[vip].line,
            refs: [{ src: "inventory", line: byAddr[vip].line },
                   { src: "globals", line: e.line }],
            msg: T("v.x.kv09.collision.msg", {
              key: esc(key), vip: esc(vip),
              hosts: byAddr[vip].hosts.map(function (h) { return "<code>" + esc(h) + "</code>"; }).join(", ")
            }),
            hint: T("v.x.kv09.collision.hint")
          });
          return;
        }

        if (!net) return;   // za mało danych, żeby cokolwiek twierdzić
        var vipParts = vip.split(".");
        if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(vip)) return;
        if (vipParts.slice(0, net.octets).join(".") === net.prefix) return;

        out.push({
          sev: lintSevB("KV-09", "subnet", acks),
          code: "KV-09-VIP-PODSIEC", src: "cross", line: null,
          refs: [{ src: "globals", line: e.line }],
          msg: T("v.x.kv09.subnet.msg", {
            key: esc(key), vip: esc(vip), prefix: esc(net.prefix), mask: net.mask
          }),
          hint: T("v.x.kv09.subnet.hint", { mask: net.mask })
        });
      });
    }

    return out;
  }

  /* ------------------------------------------------------------------ */
  /* tryb aktualizacji: ścieżka X -> Y                                   */
  /* ------------------------------------------------------------------ */

  function releaseIndex(id) {
    for (var i = 0; i < KOLLA_MATRIX.releases.length; i++) {
      if (KOLLA_MATRIX.releases[i].id === id) return i;
    }
    return -1;
  }

  /* Wydania PO obecnym, do docelowego włącznie, rosnąco. Tablica releases jest
     ułożona od najnowszego, więc nowsze wydanie ma NIŻSZY indeks. */
  function upgradePath(fromId, toId) {
    var a = releaseIndex(fromId), b = releaseIndex(toId);
    if (a === -1 || b === -1) return null;
    if (a === b) return [];
    if (b > a) return "downgrade";
    var out = [];
    for (var i = a - 1; i >= b; i--) out.push(KOLLA_MATRIX.releases[i]);
    return out;
  }

  /* Kod wpisu wynika z danych: obecność replacedBy rozróżnia przemianowanie od
     wycofania, a waga 'info' — zmianę okoliczności (np. innej grupy nadrzędnej)
     od usunięcia. Żadnej z tych decyzji nie ma w treści reguły. */
  function upgradeCode(dep) {
    if (dep.kind === "procedure") return "UPGRADE-PROCEDURA";
    var base = (dep.kind === "key") ? "UPGRADE-KLUCZ" : "UPGRADE-GRUPA";
    if (dep.replacedBy) return base + "-PRZEMIANOWANY";
    if (dep.sev === "info") return base + "-ZMIANA";
    return base + "-WYCOFANY";
  }

  function upgradeRules(groups, glob, fromId, toId) {
    var out = [];
    if (!fromId || !toId || fromId === toId) return out;

    var path = upgradePath(fromId, toId);
    if (path === null) return out;

    if (path === "downgrade") {
      out.push({
        sev: "error", code: "UPGRADE-KIERUNEK", src: "upgrade", line: null,
        msg: "Wydanie docelowe <code>" + esc(toId) + "</code> jest starsze niż obecne <code>" +
             esc(fromId) + "</code>.",
        hint: "Kolla-Ansible nie wspiera obniżania wersji i to narzędzie nie będzie udawać, " +
              "że wspiera. Powrót do wcześniejszego wydania to odtworzenie środowiska " +
              "z kopii zapasowej, nie zmiana w plikach."
      });
      return out;
    }

    var gaps = [];
    path.forEach(function (rel) {
      if (!rel.deprecationsCatalogued) { gaps.push(rel.id); return; }

      rel.deprecated.forEach(function (dep) {
        var isFileKey = (dep.kind === "key" || dep.kind === "procedure");

        /* Rzecz, której nie ma w plikach użytkownika, nie ma prawa tu wystąpić. */
        if (isFileKey) {
          if (!glob || !glob.ok || !glob.keys[dep.name]) return;
        } else {
          if (!groups[dep.name]) return;
        }

        var line = isFileKey ? glob.keys[dep.name].line : groupLine(groups[dep.name]);
        var where = isFileKey ? "globals" : "inventory";
        var subject = dep.kind === "key" || dep.kind === "procedure"
          ? "Klucz <code>" + esc(dep.name) + "</code>"
          : "Grupa <code>[" + esc(dep.name) + "]</code>";

        var what, todo;
        if (dep.kind === "procedure") {
          what = "zmienia się w wydaniu <code>" + esc(rel.id) + "</code> w sposób, którego " +
                 "nie da się załatwić edycją pliku";
          todo = "To wymaga kroku operacyjnego na działającym środowisku, nie poprawki w YAML-u. " +
                 "Narzędzie nie sprawdzi, czy krok został wykonany — potrzebowałoby historii " +
                 "wdrożenia, a nie treści pliku. Powód opisuje SCOPE.md.";
        } else if (dep.replacedBy) {
          what = "zostaje przemianowany" + (isFileKey ? "" : "a") + " na <code>" +
                 esc(dep.replacedBy) + "</code> w wydaniu <code>" + esc(rel.id) + "</code>";
          todo = T(isFileKey ? "v.u.todo.renameKey" : "v.u.todo.renameGroup");
        } else if (dep.sev === "info") {
          what = "zmienia okoliczności w wydaniu <code>" + esc(rel.id) + "</code>";
          todo = "Zmiana nie blokuje aktualizacji, ale warto ją odnotować.";
        } else {
          what = "przestaje być obsługiwan" + (isFileKey ? "y" : "a") +
                 " w wydaniu <code>" + esc(rel.id) + "</code>";
          todo = isFileKey
            ? "Usuń klucz albo pogódź się z tym, że nic już nie robi."
            : "Zaplanuj przeniesienie obciążenia i usuń grupę z inventory.";
        }

        out.push({
          sev: dep.sev || "warn", code: upgradeCode(dep), src: where, line: line,
          refs: [{ src: where, line: line }],
          msg: subject + " " + what + ".",
          hint: (dep.note ? dep.note + " " : "") + todo
        });
      });
    });

    if (gaps.length) {
      out.push({
        sev: "warn", code: "UPGRADE-LUKA", src: "upgrade", line: null,
        msg: "Ścieżka prowadzi przez " +
             plural(gaps.length, "wydanie", "wydania", "wydań") +
             " bez skatalogowanych deprecacji: <code>" + gaps.map(esc).join("</code>, <code>") +
             "</code>.",
        hint: T("v.u.gap.hint", {
          which: T(gaps.length === 1 ? "v.u.gap.which1" : "v.u.gap.whichN")
        })
      });
    }

    return out;
  }

  function analyse(parsed, release, glob, acks, releaseTo) {
    var groups = parsed.groups;
    var order = parsed.order;
    var findings = parsed.findings.slice();

    function add(sev, code, msg, line, hint) {
      findings.push({ sev: sev, code: code, msg: msg, line: line || null, hint: hint || null });
    }

    /* --- indeks hostów --- */
    var hostIndex = Object.create(null);
    order.forEach(function (name) {
      groups[name].hosts.forEach(function (h) {
        var rec = hostIndex[h.name] || (hostIndex[h.name] = { groups: Object.create(null), defs: [] });
        (rec.groups[name] || (rec.groups[name] = [])).push(h.line);
        rec.defs.push({ line: h.line, vars: h.vars, group: name });
      });
    });
    var hostNames = Object.keys(hostIndex);

    /* --- efektywna obsada grup, z memoizacją --- */
    var memo = Object.create(null);
    function effectiveHosts(name, stack) {
      if (memo[name]) return memo[name];
      if (stack[name]) return [];          // cykl — przerwij, zgłosi go osobna reguła
      stack[name] = true;
      var g = groups[name];
      var set = Object.create(null);
      if (g) {
        g.hosts.forEach(function (h) { set[h.name] = true; });
        g.children.forEach(function (c) {
          effectiveHosts(c.name, stack).forEach(function (h) { set[h] = true; });
        });
      }
      delete stack[name];
      var list = Object.keys(set);
      memo[name] = list;
      return list;
    }

    var effective = Object.create(null);
    order.forEach(function (name) { effective[name] = effectiveHosts(name, Object.create(null)); });
    /* 'all' jest grupą niejawną obejmującą każdy host w inventory */
    effective.all = hostNames;

    /* --- cykle w hierarchii grup --- */
    var cycleSeen = Object.create(null);
    for (var ci = 0; ci < order.length; ci++) {
      var cyc = detectCycle(groups, order[ci], [order[ci]], cycleSeen);
      if (cyc) {
        add("error", "CYKL-GRUP", "Cykliczna zależność grup: <code>" + cyc.cycle.map(esc).join(" &rarr; ") + "</code>.",
            cyc.line, "Ansible odrzuci takie inventory przy wczytywaniu.");
        break;
      }
    }

    /* --- grupy wymagane --- */
    REQUIRED.forEach(function (name) {
      var g = groups[name];
      var sev = CRITICAL[name] ? "error" : "warn";
      if (!g || (!g.declaredAt.length && !g.childrenAt.length)) {
        add(sev, "BRAK-GRUPY", "Brak wymaganej grupy <code>[" + name + "]</code>.", null,
            "Inventory multinode Kolla-Ansible opiera się na grupach: " +
            REQUIRED.map(function (r) { return "<code>" + r + "</code>"; }).join(", ") + ".");
        return;
      }
      if (effective[name].length === 0) {
        add(sev, "PUSTA-GRUPA", "Grupa <code>[" + name + "]</code> jest zadeklarowana, ale nie ma żadnego hosta.",
            g.declaredAt[0] || g.childrenAt[0],
            name === "compute" ? "Bez węzłów obliczeniowych nie uruchomisz żadnej instancji."
              : name === "network" ? "Bez węzłów sieciowych nie wstaną agenty L3, DHCP ani metadata."
              : name === "control" ? "Bez węzłów sterujących nie wdrożysz usług płaszczyzny sterowania."
              : name === "storage" ? "Wdrożenie zadziała, ale usługi wolumenów (Cinder) nie będą miały gdzie wystartować."
              : "Wdrożenie zadziała, ale Prometheus i Grafana nie będą miały gdzie wystartować.");
      }
    });

    /* --- pozostałe puste grupy --- */
    order.forEach(function (name) {
      if (REQUIRED.indexOf(name) !== -1 || IMPLICIT[name]) return;
      var g = groups[name];
      if (!g.declaredAt.length && !g.childrenAt.length && !g.varsAt.length) return;
      if (effective[name].length === 0) {
        add("warn", "PUSTA-GRUPA", "Grupa <code>[" + esc(name) + "]</code> nie zawiera żadnego hosta.",
            g.declaredAt[0] || g.childrenAt[0] || g.varsAt[0],
            "Pusta grupa jest ignorowana przy wdrożeniu — usuń ją albo uzupełnij obsadę.");
      }
    });

    /* --- grupy używane, ale niezdefiniowane --- */
    order.forEach(function (name) {
      if (IMPLICIT[name]) return;
      var g = groups[name];
      if (g.declaredAt.length || g.childrenAt.length) return;
      if (g.referencedAt.length) {
        add("error", "GRUPA-NIEZDEF", "Grupa <code>" + esc(name) + "</code> jest wskazana jako podgrupa, ale nigdzie nie została zdefiniowana.",
            g.referencedAt[0], "Dodaj sekcję <code>[" + esc(name) + "]</code> albo usuń wpis z listy podgrup.");
      } else if (g.varsAt.length) {
        add("warn", "GRUPA-TYLKO-VARS", "Grupa <code>" + esc(name) + "</code> ma sekcję zmiennych, ale nie ma hostów ani podgrup.",
            g.varsAt[0], "Zmienne nie zostaną nigdzie zastosowane.");
      }
    });

    /* --- duplikaty w obrębie grupy --- */
    order.forEach(function (name) {
      var g = groups[name];
      var seen = Object.create(null);
      g.hosts.forEach(function (h) {
        if (seen[h.name]) {
          add("error", "DUPLIKAT-HOST", "Host <code>" + esc(h.name) + "</code> jest wpisany dwukrotnie w grupie <code>[" + esc(name) + "]</code>.",
              h.line, "Pierwsze wystąpienie: linia " + seen[h.name] + ". Powielony wpis może nadpisać zmienne hosta.");
        } else {
          seen[h.name] = h.line;
        }
      });

      var seenChild = Object.create(null);
      g.children.forEach(function (c) {
        if (seenChild[c.name]) {
          add("warn", "DUPLIKAT-PODGRUPA", "Podgrupa <code>" + esc(c.name) + "</code> jest wymieniona dwukrotnie w <code>[" + esc(name) + ":children]</code>.",
              c.line, "Pierwsze wystąpienie: linia " + seenChild[c.name] + ".");
        } else {
          seenChild[c.name] = c.line;
        }
        if (c.name === name) {
          add("error", "PODGRUPA-SAMA", "Grupa <code>" + esc(name) + "</code> wskazuje samą siebie jako podgrupę.", c.line);
        }
      });

      var seenVar = Object.create(null);
      g.vars.forEach(function (v) {
        if (seenVar[v.key]) {
          add("warn", "DUPLIKAT-ZMIENNEJ", "Zmienna <code>" + esc(v.key) + "</code> jest ustawiona dwukrotnie w <code>[" + esc(name) + ":vars]</code>.",
              v.line, "Pierwsze wystąpienie: linia " + seenVar[v.key] + ". Obowiązuje wartość z ostatniego wpisu.");
        } else {
          seenVar[v.key] = v.line;
        }
      });
    });

    /* --- sprzeczne zmienne tego samego hosta --- */
    hostNames.forEach(function (host) {
      var rec = hostIndex[host];
      if (rec.defs.length < 2) return;
      var values = Object.create(null);
      rec.defs.forEach(function (d) {
        Object.keys(d.vars).forEach(function (key) {
          if (!(key in values)) { values[key] = { val: d.vars[key], line: d.line }; return; }
          if (values[key].val !== d.vars[key]) {
            add("error", "SPRZECZNA-ZMIENNA", "Host <code>" + esc(host) + "</code> ma dwie różne wartości <code>" + esc(key) +
                "</code>: <code>" + esc(values[key].val) + "</code> (linia " + values[key].line + ") oraz <code>" + esc(d.vars[key]) + "</code>.",
                d.line, "Ansible użyje ostatniej definicji — rozbieżność prawie zawsze oznacza błąd w pliku.");
          }
        });
      });
    });

    /* --- ten sam punkt dostępu pod różnymi nazwami ---
       Rozróżniamy adres i port: ten sam adres z różnymi portami to poprawna
       topologia (NAT, lab zagnieżdżony), ten sam adres i port to konflikt. */
    var byEndpoint = Object.create(null);
    var byAddress = Object.create(null);
    hostNames.forEach(function (host) {
      hostIndex[host].defs.forEach(function (d) {
        var addr = d.vars.ansible_host;
        if (!addr) return;
        var endpoint = addr + ":" + (d.vars.ansible_port || "22");
        (byEndpoint[endpoint] || (byEndpoint[endpoint] = Object.create(null)))[host] = d.line;
        (byAddress[addr] || (byAddress[addr] = Object.create(null)))[host] = d.line;
      });
    });
    Object.keys(byEndpoint).forEach(function (endpoint) {
      var hosts = Object.keys(byEndpoint[endpoint]);
      if (hosts.length < 2) return;
      add("error", "DUPLIKAT-ADRESU", "Punkt dostępu <code>" + esc(endpoint) + "</code> jest przypisany do różnych hostów: " +
          hosts.map(function (n) { return "<code>" + esc(n) + "</code>"; }).join(", ") + ".",
          byEndpoint[endpoint][hosts[1]],
          "Kolla potraktuje je jako osobne węzły i wdroży na jedną maszynę sprzeczne konfiguracje.");
    });
    Object.keys(byAddress).forEach(function (addr) {
      var hosts = Object.keys(byAddress[addr]);
      if (hosts.length < 2) return;
      var conflicting = Object.keys(byEndpoint).some(function (e) {
        return e.indexOf(addr + ":") === 0 && Object.keys(byEndpoint[e]).length > 1;
      });
      if (conflicting) return;   // zgłoszone już jako błąd wyżej
      add("info", "WSPOLNY-ADRES", "Adres <code>" + esc(addr) + "</code> obsługuje kilka hostów na różnych portach: " +
          hosts.map(function (n) { return "<code>" + esc(n) + "</code>"; }).join(", ") + ".",
          byAddress[addr][hosts[1]], "Poprawne przy NAT lub labie zagnieżdżonym — upewnij się, że taka była intencja.");
    });

    /* --- hosty bez ansible_host --- */
    var noAddr = hostNames.filter(function (host) {
      return hostIndex[host].defs.every(function (d) { return !d.vars.ansible_host; }) &&
             host !== "localhost" && !/^\d{1,3}(\.\d{1,3}){3}$/.test(host) && host.indexOf(".") === -1;
    });
    if (noAddr.length) {
      add("info", "BRAK-ADRESU", plural(noAddr.length, "Host", "Hosty", "Hostów") + " bez <code>ansible_host</code>: " +
          noAddr.slice(0, 8).map(function (n) { return "<code>" + esc(n) + "</code>"; }).join(", ") +
          (noAddr.length > 8 ? " i " + (noAddr.length - 8) + " więcej" : "") + ".",
          hostIndex[noAddr[0]].defs[0].line,
          "Nazwa musi być rozwiązywalna przez DNS lub <code>/etc/hosts</code> na hoście wdrożeniowym.");
    }

    /* Liczebność grup obsługują quorumRules() i collocationRules(). Wcześniejsze
       reguły KWORUM i BEZ-HA stały tutaj i po dołożeniu tamtych dawały drugi wpis
       o tym samym, w innej wadze — usunięte, nie zduplikowane. */

    /* --- literówki w nazwach grup --- */
    order.forEach(function (name) {
      if (IMPLICIT[name] || KNOWN.indexOf(name) !== -1) return;
      var g = groups[name];
      if (!g.declaredAt.length && !g.childrenAt.length) return;
      var line = g.declaredAt[0] || g.childrenAt[0];
      var best = null, bestD = 99;
      if (name.length >= 4) {
        KNOWN.forEach(function (k) {
          var dist = levenshtein(name.toLowerCase(), k);
          if (dist < bestD) { bestD = dist; best = k; }
        });
      }
      if (best && bestD <= 2 && Math.abs(best.length - name.length) <= 2) {
        add("warn", "LITEROWKA", "Grupa <code>" + esc(name) + "</code> przypomina standardową grupę <code>" + best + "</code>.",
            line, "Kolla-Ansible nie rozpozna grupy o innej nazwie — sprawdź pisownię.");
      } else {
        add("info", "GRUPA-WLASNA", "Grupa <code>" + esc(name) + "</code> nie występuje w referencyjnym inventory Kolla-Ansible.",
            line, "To poprawne, o ile jest używana świadomie (np. własne role lub podział sprzętowy).");
      }
    });

    /* --- kolokacja ról --- */
    var gflags = glob ? globalsFlags(glob) : Object.create(null);
    collocationRules(groups, effective, hostNames, gflags).forEach(function (f) { findings.push(f); });

    /* --- reguły wymagające obu plików --- */
    crossRules(groups, order, effective, hostIndex, glob, acks || Object.create(null))
      .forEach(function (f) { findings.push(f); });

    /* --- ścieżka aktualizacji --- */
    upgradeRules(groups, glob, release, releaseTo).forEach(function (f) { findings.push(f); });

    /* --- reguły zależne od wydania --- */
    releaseRules(release, groups).forEach(function (f) { findings.push(f); });

    /* --- kworum i liczebność grup --- */
    quorumRules(groups, effective, hostNames).forEach(function (f) { findings.push(f); });

    if (!hostNames.length && !findings.some(function (f) { return f.sev === "error"; })) {
      add("error", "BRAK-HOSTOW", "Inventory nie zawiera żadnego hosta.", null);
    }

    /* Plik był dotąd jeden, więc źródło findingu było niejawne. Od trybu łączonego
       musi być jawne — inaczej numer linii wskazuje nie wiadomo gdzie. */
    findings.forEach(function (f) { if (!f.src) f.src = "inventory"; });

    var rank = { error: 0, warn: 1, info: 2 };
    findings.sort(function (a, b) {
      if (rank[a.sev] !== rank[b.sev]) return rank[a.sev] - rank[b.sev];
      return (a.line || 1e9) - (b.line || 1e9);
    });

    return {
      findings: findings, groups: groups, order: order,
      effective: effective, hostCount: hostNames.length,
      release: findRelease(release), hasGlobals: !!glob,
      releaseTo: releaseTo ? findRelease(releaseTo) : null
    };
  }

  /* ================================================================== */
  /* render                                                              */
  /* ================================================================== */

  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function plural(n, one, few, many) {
    if (n === 1) return one;
    if (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) return few;
    return many;
  }

  function countLabel(n, one, few, many) { return n + " " + plural(n, one, few, many); }

  function renderGutter(text, marks) {
    var count = text.split(/\r?\n/).length;
    if (count > GUTTER_MARK_LIMIT) {
      var plain = "";
      for (var j = 1; j <= count; j++) plain += j + "\n";
      el.gutter.textContent = plain;
    } else {
      var html = "";
      for (var i = 1; i <= count; i++) {
        var cls = marks[i] === "error" ? ' class="g-err"' : (marks[i] === "warn" ? ' class="g-warn"' : "");
        html += "<span" + cls + ">" + i + "</span>";
      }
      el.gutter.innerHTML = html;
    }
    el.gutter.scrollTop = el.src.scrollTop;
  }

  function lineHeight() {
    var lh = parseFloat(window.getComputedStyle(el.src).lineHeight);
    return (lh && isFinite(lh)) ? lh : 21;
  }

  function selectLine(no) {
    var lines = el.src.value.split("\n");
    if (no < 1 || no > lines.length) return;
    var start = 0;
    for (var i = 0; i < no - 1; i++) start += lines[i].length + 1;
    el.src.focus();
    el.src.setSelectionRange(start, start + lines[no - 1].length);
    var lh = lineHeight();
    el.src.scrollTop = Math.max(0, (no - 1) * lh - el.src.clientHeight / 2 + lh / 2);
    el.gutter.scrollTop = el.src.scrollTop;
  }

  function renderFindings(list) {
    el.findings.innerHTML = list.map(function (f) {
      var label = f.sev === "error" ? "błąd" : (f.sev === "warn" ? "uwaga" : "info");
      var meta = "<span>" + f.code + "</span>";
      var srcLabel = { globals: "globals", cross: T("v.src.both"), upgrade: T("v.src.path") }[f.src] || "inventory";
      meta += '<span class="src ' + (f.src === "inventory" ? "" : f.src) + '">' + srcLabel + "</span>";
      /* Kliknięcie prowadzi tylko do inventory — tylko ten edytor ma margines z liniami.
         Odsyłacz do globals jest etykietą, żeby nie obiecywać skoku, którego nie ma. */
      if (f.line && f.src !== "globals") {
        meta += '<button type="button" class="f-line" data-line="' + f.line + '">inventory: linia ' + f.line + "</button>";
      }
      (f.refs || []).forEach(function (r) {
        if (r.src === "inventory") {
          if (r.line && r.line !== f.line) {
            meta += '<button type="button" class="f-line" data-line="' + r.line + '">inventory: linia ' + r.line + "</button>";
          }
        } else {
          meta += "<span>globals: " + (r.line ? "linia " + r.line : "klucza brak") + "</span>";
        }
      });
      return '<li><span class="sev ' + f.sev + '">' + label + "</span>" +
             '<div class="f-body"><div class="f-msg">' + f.msg + "</div>" +
             (f.hint ? '<div class="f-hint">' + f.hint + "</div>" : "") +
             '<div class="f-meta">' + meta + "</div></div></li>";
    }).join("");
  }

  function renderTopology(res) {
    var listed = res.order.slice().sort(function (a, b) {
      var ra = REQUIRED.indexOf(a), rb = REQUIRED.indexOf(b);
      if (ra !== -1 || rb !== -1) {
        if (ra === -1) return 1;
        if (rb === -1) return -1;
        return ra - rb;
      }
      return a < b ? -1 : 1;
    });

    var rows = listed.map(function (name) {
      var g = res.groups[name];
      var hosts = res.effective[name] || [];
      var tag = REQUIRED.indexOf(name) !== -1 ? '<span class="tag req">wymagana</span>'
              : IMPLICIT[name] ? '<span class="tag impl">niejawna</span>'
              : KNOWN.indexOf(name) === -1 ? '<span class="tag cust">własna</span>' : "";
      var kids = g.children.length
        ? '<div class="hostlist">' + esc(T("v.topology.subgroups", { list: g.children.map(function (c) { return c.name; }).join(", ") })) + "</div>"
        : "";
      var shown = hosts.slice(0, 12).map(esc).join(", ") + (hosts.length > 12 ? ", … +" + (hosts.length - 12) : "");
      var zero = hosts.length === 0 && !IMPLICIT[name];
      return '<tr><td class="g">' + esc(name) + tag + "</td>" +
             '<td><div class="hostlist">' + (hosts.length ? shown : "—") + "</div>" + kids + "</td>" +
             '<td class="num' + (zero ? " count-0" : "") + '">' + hosts.length + "</td></tr>";
    }).join("");

    var missing = REQUIRED.filter(function (r) { return res.order.indexOf(r) === -1; }).map(function (r) {
      return '<tr><td class="g">' + r + '<span class="tag req">' + esc(T("v.topology.required")) + "</span></td>" +
             '<td><div class="hostlist missing">' + esc(T("v.topology.missing")) + "</div></td>" +
             '<td class="num count-0">0</td></tr>';
    }).join("");

    el.topology.innerHTML = (rows || missing)
      ? '<table><thead><tr><th>' + esc(T("v.topology.group")) + "</th><th>" + esc(T("v.topology.hosts")) +
        '</th><th class="num">' + esc(T("v.topology.count")) + "</th></tr></thead><tbody>" + rows + missing + "</tbody></table>"
      : '<p class="empty-state">' + esc(T("v.empty")) + "</p>";

    el.chipHosts.textContent = I18N.count("n.host", res.hostCount);
  }

  function renderVerdict(list) {
    var e = 0, w = 0, n = 0;
    list.forEach(function (f) {
      if (f.sev === "error") e++; else if (f.sev === "warn") w++; else n++;
    });

    el.verdict.classList.toggle("err", e > 0);
    el.verdict.classList.toggle("warn", e === 0 && w > 0);

    if (e) el.verdictTxt.textContent = T("v.verdict.errors");
    else if (w) el.verdictTxt.textContent = T("v.verdict.warnings");
    else el.verdictTxt.textContent = T("v.verdict.clean");

    var chips = "";
    if (e) chips += '<span class="chip e">' + I18N.count("n.error", e) + "</span>";
    if (w) chips += '<span class="chip w">' + I18N.count("n.warning", w) + "</span>";
    if (n) chips += '<span class="chip i">' + n + " info</span>";
    el.counts.innerHTML = chips;

    return { e: e, w: w, i: n };
  }

  function stripTags(html) {
    return String(html).replace(/<[^>]*>/g, "")
      .replace(/&rarr;/g, "->")
      .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"').replace(/&#39;/g, "'")
      .replace(/&nbsp;/g, " ").replace(/&amp;/g, "&");
  }

  function pad(s, n) {
    s = String(s);
    while (s.length < n) s += " ";
    return s;
  }

  function buildReport(res, tally) {
    var L = [];
    L.push(T("v.rep.title"));
    L.push("===================================================");
    L.push(T("v.rep.hosts", { hosts: res.hostCount, groups: res.order.length }));
    if (res.releaseTo) {
      L.push(T("v.rep.path", { from: res.release ? res.release.id : "?", to: res.releaseTo.id }));
    }
    L.push(T(res.hasGlobals ? "v.rep.globalsYes" : "v.rep.globalsNo"));
    if (res.release) {
      L.push(T("v.rep.release", {
        id: res.release.id, name: res.release.name,
        kolla: res.release.kolla ? " (kolla-ansible " + res.release.kolla + ")" : ""
      }));
    }
    L.push(T("v.rep.result", {
      errors: I18N.count("n.error", tally.e),
      warnings: I18N.count("n.warning", tally.w),
      info: tally.i
    }));
    L.push("");

    if (!res.findings.length) {
      L.push(T("v.rep.clean"));
    } else {
      res.findings.forEach(function (f) {
        var sev = T(f.sev === "error" ? "v.sev.error" : (f.sev === "warn" ? "v.sev.warn" : "v.sev.info"));
        var where = f.src === "cross" ? T("v.rep.both") : f.src;
        L.push("[" + sev + "] " + pad(f.line ? where + ":" + f.line : where, 16) +
               pad(f.code, 24) + stripTags(f.msg));
        (f.refs || []).forEach(function (r) {
          L.push("          -> " + r.src + ": " +
                 (r.line ? T("v.rep.refLine", { line: r.line }) : T("v.rep.refMissing")));
        });
        if (f.hint) L.push("          " + stripTags(f.hint));
      });
    }

    L.push("");
    L.push(T("v.rep.topology"));
    var shown = REQUIRED.concat(res.order.filter(function (g) {
      return REQUIRED.indexOf(g) === -1 && !IMPLICIT[g];
    }));
    shown.forEach(function (name) {
      var hosts = res.effective[name];
      L.push("  " + pad(name, 16) +
             (hosts ? I18N.count("n.host", hosts.length) : T("v.rep.absent")));
    });
    return L.join("\n");
  }

  /* ================================================================== */
  /* pętla główna                                                        */
  /* ================================================================== */

  function reset() {
    el.findings.innerHTML = "";
    el.verdict.classList.remove("err", "warn");
    el.verdictTxt.textContent = T("v.start");
    el.counts.innerHTML = "";
    el.topology.innerHTML = '<p class="empty-state">' + esc(T("v.empty")) + "</p>";
    el.chipHosts.textContent = I18N.count("n.host", 0);
    lastReport = null;
    el.btnReport.disabled = true;
  }

  function run() {
    var text = el.src.value;

    if (!text.trim()) {
      renderGutter(text, {});
      reset();
      return;
    }

    var gtext = el.gsrc.value;
    var glob = gtext.trim() ? GLOBALS.parse(gtext) : null;
    var res = analyse(parse(text), el.release.value, glob,
                      { ack_nobmc: el.ackNoBmc.checked }, el.releaseTo.value);

    var marks = {};
    res.findings.forEach(function (f) {
      /* margines należy do edytora inventory — wpis wskazujący globals nie ma tu czego oznaczać */
      if (!f.line || f.src === "globals") return;
      if (f.sev === "error") marks[f.line] = "error";
      else if (f.sev === "warn" && marks[f.line] !== "error") marks[f.line] = "warn";
    });

    renderGutter(text, marks);
    renderFindings(res.findings);
    renderTopology(res);
    var tally = renderVerdict(res.findings);
    lastReport = buildReport(res, tally);
    el.btnReport.disabled = false;
  }

  var debounceTimer = null;
  function scheduleRun() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(run, 140);
  }

  /* ================================================================== */
  /* zdarzenia                                                           */
  /* ================================================================== */

  var toastTimer = null;
  function toast(msg, alert) {
    el.toast.textContent = msg;
    el.toast.classList.toggle("alert", !!alert);
    el.toast.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove("on"); }, 2400);
  }

  el.src.addEventListener("input", scheduleRun);
  el.src.addEventListener("scroll", function () { el.gutter.scrollTop = el.src.scrollTop; });

  el.findings.addEventListener("click", function (e) {
    var btn = e.target && e.target.closest ? e.target.closest(".f-line") : null;
    if (btn) selectLine(parseInt(btn.getAttribute("data-line"), 10));
  });

  document.getElementById("btn-clear").addEventListener("click", function () {
    el.src.value = "";
    run();
    el.src.focus();
  });

  document.getElementById("btn-file").addEventListener("click", function () { el.file.click(); });
  el.file.addEventListener("change", function () {
    var f = el.file.files && el.file.files[0];
    if (f) readFile(f);
    el.file.value = "";
  });

  function readFile(f) {
    var reader = new FileReader();
    reader.onload = function () {
      el.src.value = String(reader.result);
      run();
      toast("Wczytano " + f.name);
    };
    reader.onerror = function () { toast("Nie udało się odczytać pliku.", true); };
    reader.readAsText(f);
  }

  ["dragenter", "dragover"].forEach(function (ev) {
    el.editor.addEventListener(ev, function (e) { e.preventDefault(); el.editor.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    el.editor.addEventListener(ev, function (e) { e.preventDefault(); el.editor.classList.remove("drag"); });
  });
  el.editor.addEventListener("drop", function (e) {
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  el.btnReport.addEventListener("click", function () {
    if (!lastReport) return;
    copyText(lastReport + "\n");
  });

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        navigator.clipboard.writeText(text).then(
          function () { toast("Raport skopiowany do schowka."); },
          function () { legacyCopy(text); }
        );
        return;
      } catch (e) { /* polityka uprawnień potrafi rzucić synchronicznie */ }
    }
    legacyCopy(text);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-1000px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Raport skopiowany do schowka." : "Nie udało się skopiować raportu.", !ok);
  }

  /* ---- przykłady ---- */
  var SAMPLE_OK_BODY = [
    "",
    "[control]",
    "ctrl01 ansible_host=10.10.0.11",
    "ctrl02 ansible_host=10.10.0.12",
    "ctrl03 ansible_host=10.10.0.13",
    "",
    "[network]",
    "net01 ansible_host=10.10.0.21",
    "net02 ansible_host=10.10.0.22",
    "",
    "[compute]",
    "cmp01 ansible_host=10.10.0.31",
    "cmp02 ansible_host=10.10.0.32",
    "cmp03 ansible_host=10.10.0.33",
    "cmp04 ansible_host=10.10.0.34",
    "",
    "[storage]",
    "str01 ansible_host=10.10.0.41",
    "str02 ansible_host=10.10.0.42",
    "",
    "[monitoring]",
    "mon01 ansible_host=10.10.0.51",
    "",
    "[deployment:children]",
    "control",
    "",
    "[all:vars]",
    "ansible_user=deploy",
    "ansible_become=true",
    ""
  ].join("\n");

  var SAMPLE_BAD_BODY = [
    "orphan01 ansible_host=10.10.0.9",
    "",
    "[control]",
    "ctrl01 ansible_host=10.10.0.11",
    "ctrl02 ansible_host=10.10.0.12",
    "ctrl01 ansible_host=10.10.0.99",
    "",
    "[netwrok]",
    "net01 ansible_host=10.10.0.21",
    "",
    "[compute]",
    "cmp[01-04]",
    "",
    "[storage]",
    "str01 ansible_host=10.10.0.41",
    "cmp01 ansible_host=10.10.0.41",
    "",
    "[monitoring:children]",
    "metrics",
    "",
    "[all:vars]",
    "ansible_user deploy",
    ""
  ].join("\n");

  /* Komentarz nagłówkowy przykładu jest tłumaczony, ale MUSI zostać jedną linią:
     dłuższy tekst przesunąłby wszystko poniżej i ten sam przykład dawałby inne
     numery linii w każdym języku — czyli dokładnie to, czego zakazuje asercja
     równoważności. Jeśli angielski się nie mieści, skraca się polski. */
  function sampleText(key, body) {
    return "# " + String(T(key)).replace(/[\r\n]+/g, " ") + "\n" + body;
  }
  function SAMPLE_OK() { return sampleText("v.sample.ok", SAMPLE_OK_BODY); }
  function SAMPLE_BAD() { return sampleText("v.sample.bad", SAMPLE_BAD_BODY); }

  document.getElementById("btn-sample-ok").addEventListener("click", function () {
    el.src.value = SAMPLE_OK(); run(); toast("Wczytano przykład poprawny.");
  });
  document.getElementById("btn-sample-bad").addEventListener("click", function () {
    el.src.value = SAMPLE_BAD(); run(); toast("Wczytano przykład z błędami.");
  });

  /* Lista wydań pochodzi z macierzy, żeby jej rozszerzenie nie wymagało
     dotykania znaczników HTML. */
  function populateReleases(keepFrom, keepTo) {
    var statusTag = {
      development: "w rozwoju", maintained: "wspierane",
      unmaintained: "bez utrzymania", eol: "EOL"
    };
    var opts = KOLLA_MATRIX.releases.map(function (r) {
      return '<option value="' + esc(r.id) + '">' + esc(r.id) + " · " + esc(r.name) +
             " · " + esc(statusTag[r.status] || r.status) + "</option>";
    }).join("");
    el.release.innerHTML = opts;
    el.release.value = keepFrom || defaultRelease();
    /* Puste = tryb aktualizacji wyłączony; narzędzie zachowuje się jak dotąd. */
    el.releaseTo.innerHTML = '<option value="">' + esc(T("v.releaseTo.none")) + "</option>" + opts;
    el.releaseTo.value = keepTo || "";
  }

  el.release.addEventListener("change", run);
  el.releaseTo.addEventListener("change", run);

  /* ---- opcjonalny globals.yml ---- */
  function globalsState() {
    var has = el.gsrc.value.trim().length > 0;
    el.btnGclear.disabled = !has;
    el.gscope.hidden = !has;
    el.chipGlobals.textContent = T(has ? "v.globals.loaded" : "v.globals.none");
  }

  function readGlobalsFile(file) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () { el.gsrc.value = String(r.result); globalsState(); run();
                             toast("Wczytano globals.yml — reguły dwuplikowe włączone."); };
    r.onerror = function () { toast("Nie udało się odczytać pliku.", true); };
    r.readAsText(file);
  }

  el.gsrc.addEventListener("input", function () { globalsState(); scheduleRun(); });
  el.ackNoBmc.addEventListener("change", run);
  document.getElementById("btn-gfile").addEventListener("click", function () { el.gfile.click(); });
  el.gfile.addEventListener("change", function () {
    readGlobalsFile(this.files && this.files[0]);
    this.value = "";
  });
  el.btnGclear.addEventListener("click", function () {
    el.gsrc.value = "";
    globalsState();
    run();
    toast("Usunięto globals.yml — zostały reguły inventory.");
  });
  ["dragenter", "dragover"].forEach(function (ev) {
    el.gsrc.addEventListener(ev, function (e) { e.preventDefault(); el.gsrc.classList.add("drag"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    el.gsrc.addEventListener(ev, function (e) { e.preventDefault(); el.gsrc.classList.remove("drag"); });
  });
  el.gsrc.addEventListener("drop", function (e) {
    readGlobalsFile(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  /* ---- język ---- */
  /* Teksty stałe interfejsu biorą się ze znaczników data-i18n; teksty zależne od
     danych powstają w run() i renderach, więc po przełączeniu wystarczy je
     przeliczyć od nowa. */
  function applyI18n() {
    document.title = T("v.title");
    var d = document.querySelector('meta[name="description"]');
    if (d) d.setAttribute("content", T("v.desc"));
    var nav = document.getElementById("nav");
    if (nav) nav.setAttribute("aria-label", T("nav.tools"));

    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) nodes[i].innerHTML = T(nodes[i].getAttribute("data-i18n"));
    nodes = document.querySelectorAll("[data-i18n-ph]");
    for (i = 0; i < nodes.length; i++) nodes[i].setAttribute("placeholder", T(nodes[i].getAttribute("data-i18n-ph")));
    nodes = document.querySelectorAll("[data-i18n-title]");
    for (i = 0; i < nodes.length; i++) nodes[i].setAttribute("title", T(nodes[i].getAttribute("data-i18n-title")));
    nodes = document.querySelectorAll("[data-i18n-label]");
    for (i = 0; i < nodes.length; i++) nodes[i].setAttribute("aria-label", T(nodes[i].getAttribute("data-i18n-label")));
  }


  /* ---- start ---- */
  applyI18n();
  populateReleases();
  globalsState();
  reset();
  renderGutter("", {});
})();
</script>
</body>
</html>
