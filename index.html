    var lang = "en";

    function setLang(value) { lang = (value === "pl") ? "pl" : "en"; }
    function getLang() { return lang; }

    function t(key, vars) {
      var entry = DICT[key];
      /* Brakującego klucza nie ukrywamy pustym napisem — ma być widoczny.
         Strażnik kompletności w CI i tak nie przepuści takiego stanu do main. */
      if (!entry) return "[[" + key + "]]";
      var s = entry[lang];
      if (s === undefined || s === null) s = entry.en;
      if (!vars) return s;
      return String(s).replace(/\{(\w+)\}/g, function (whole, name) {
        return Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : whole;
      });
    }

    /* Forma liczebnika dla bieżącego języka. */
    function plural(key, n) {
      var forms = String(t(key)).split("|");
      var i;
      if (lang === "pl") {
        i = (n === 1) ? 0
          : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 1 : 2;
      } else {
        i = (n === 1) ? 0 : 1;
      }
      return forms[Math.min(i, forms.length - 1)];
    }

    function count(key, n) { return n + " " + plural(key, n); }

    /* Pamięć wyboru języka. Przy file:// bywa niedostępna — wtedy narzędzie
       działa dalej po angielsku i nie zostawia śladu w konsoli. */
    var STORE_KEY = "rackpathlabs.lang";

    function load() {
      try {
        var v = localStorage.getItem(STORE_KEY);
        if (v === "pl" || v === "en") setLang(v);
      } catch (e) { /* brak pamięci to nie jest błąd, tylko mniej wygody */ }
    }

    function save() {
      try { localStorage.setItem(STORE_KEY, lang); } catch (e) { /* jak wyżej */ }
    }

    return {
      t: t, plural: plural, count: count,
      setLang: setLang, getLang: getLang,
      load: load, save: save,
      dict: DICT,
      keys: function () { return Object.keys(DICT); }
    };
  })();

  var T = I18N.t;
  /* == KOLLA-I18N END == */

  function apply() {
    document.documentElement.lang = I18N.getLang();
    document.title = T("hub.title");
    var d = document.querySelector('meta[name="description"]');
    if (d) d.setAttribute("content", T("hub.desc"));
    var lg = document.getElementById("lang");
    if (lg) lg.setAttribute("aria-label", T("lang.label"));
    var nav = document.getElementById("nav");
    if (nav) nav.setAttribute("aria-label", T("nav.tools"));
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) {
      nodes[i].innerHTML = T(nodes[i].getAttribute("data-i18n"));
    }
    var b = document.querySelectorAll("#lang button");
    for (var j = 0; j < b.length; j++) {
      b[j].setAttribute("aria-pressed", b[j].getAttribute("data-lang") === I18N.getLang() ? "true" : "false");
      b[j].setAttribute("title", T(b[j].getAttribute("data-lang") === "pl" ? "lang.pl" : "lang.en"));
    }
  }

  document.getElementById("lang").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button[data-lang]") : null;
    if (!b) return;
    I18N.setLang(b.getAttribute("data-lang"));
    I18N.save();
    apply();
  });

  I18N.load();
  apply();
})();
