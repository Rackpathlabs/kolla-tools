<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>fixtura czysta</title></head>
<body>
<script>
(function () {
  /* Komentarz wymienia fetch() i XMLHttpRequest — straznik wycina komentarze,
     wiec wlasny opis polityki nie ma prawa go zapalic. */
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["x"]));
})();
</script>
