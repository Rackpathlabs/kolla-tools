---
# Generated with Rackpathlabs globals.yml generator
#
# Kolla-Ansible configuration file: /etc/kolla/globals.yml
# Target release: 2025.1   |   base image: rocky
# Epoxy, kolla-ansible 20.x, support status: maintained
#
# Verify these values against the target hosts before running
# 'kolla-ansible prechecks' and 'kolla-ansible deploy'.

###############################################################################
# Base image and release
###############################################################################
kolla_base_distro: "rocky"
openstack_release: "2025.1"

###############################################################################
# Network
#
# network_interface           - management/API network, needs an IP on every node
# neutron_external_interface  - external traffic; no IP and no configuration on it
# kolla_internal_vip_address  - free address on the management network, not held by a host
###############################################################################
network_interface: "bond0"
neutron_external_interface: "eth3"
kolla_internal_vip_address: "10.50.0.250"
neutron_bridge_name: "br-ex"
api_interface: "bond0"
storage_interface: "bond0"
migration_interface: "bond0"

###############################################################################
# Load balancing
###############################################################################
enable_haproxy: "yes"

###############################################################################
# OpenStack services
###############################################################################
enable_cinder: "yes"
enable_cinder_backend_lvm: "yes"
cinder_volume_group: "cinder-volumes"
enable_heat: "no"
enable_horizon: "yes"
enable_barbican: "no"
enable_octavia: "no"
enable_prometheus: "no"
enable_grafana: "no"
enable_hacluster: "yes"
enable_masakari: "yes"
# Masakari without working STONITH is not high availability. Network isolation
# of a node looks like its failure: the instance is rebuilt elsewhere while the
# original still holds an open RBD descriptor.

###############################################################################
# Neutron
###############################################################################
neutron_plugin_agent: "openvswitch"
enable_neutron_provider_networks: "no"

###############################################################################
# RabbitMQ
###############################################################################
om_enable_rabbitmq_stream_fanout: "yes"
# Set to the 2025.1 default on purpose rather than left implicit.
# With true, all stream leaders can end up on a single broker; check how they
# are distributed across the nodes after deploying.

###############################################################################
# Acknowledged by the operator; not verified by this tool:
#   - storage and API traffic on a shared base device: headroom measured,
#     switch applies queueing
#   - migration over api_interface: dedicated network configured outside
#     Kolla, via live_migration_inbound_addr in a nova-compute override
###############################################################################
