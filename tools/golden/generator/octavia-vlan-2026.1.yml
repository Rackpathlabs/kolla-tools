---
# Generated with Rackpathlabs globals.yml generator
#
# Kolla-Ansible configuration file: /etc/kolla/globals.yml
# Target release: 2026.1   |   base image: ubuntu
# Gazpacho, kolla-ansible 22.x, support status: maintained
#
# Verify these values against the target hosts before running
# 'kolla-ansible prechecks' and 'kolla-ansible deploy'.

###############################################################################
# Base image and release
###############################################################################
kolla_base_distro: "ubuntu"
openstack_release: "2026.1"

###############################################################################
# Network
#
# network_interface           - management/API network, needs an IP on every node
# neutron_external_interface  - external traffic; no IP and no configuration on it
# kolla_internal_vip_address  - free address on the management network, not held by a host
###############################################################################
network_interface: "bond0.10"
neutron_external_interface: "bond2,bond3"
kolla_internal_vip_address: "10.40.0.250"
neutron_bridge_name: "br-ex,br-ex2"
api_interface: "bond0.10"
storage_interface: ""    # INVALID: value rejected, this file is not ready to deploy
migration_interface: ""    # INVALID: value rejected, this file is not ready to deploy
kolla_external_vip_address: "203.0.113.20"
kolla_external_vip_interface: "bond1"

###############################################################################
# Endpoint names and TLS
###############################################################################
kolla_internal_fqdn: "internal.cloud.example.net"
kolla_external_fqdn: "cloud.example.net"
kolla_enable_tls_internal: "yes"
kolla_copy_ca_into_containers: "yes"
kolla_enable_letsencrypt: "no"

###############################################################################
# Load balancing
###############################################################################
enable_haproxy: "yes"

###############################################################################
# OpenStack services
###############################################################################
enable_cinder: "yes"
cinder_backend_ceph: "yes"
glance_backend_ceph: "yes"
# Kolla-Ansible does not deploy Ceph. The cluster must already exist, and
# ceph.conf plus the keyrings go into the config directory before deploying.
enable_heat: "yes"
enable_horizon: "yes"
enable_barbican: "yes"
enable_octavia: "yes"
enable_prometheus: "yes"
enable_grafana: "yes"
enable_hacluster: "yes"
enable_masakari: "yes"
# Masakari without working STONITH is not high availability. Network isolation
# of a node looks like its failure: the instance is rebuilt elsewhere while the
# original still holds an open RBD descriptor.

###############################################################################
# Neutron
###############################################################################
neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: "yes"
# Provider networks map straight onto the physical network attached to
# neutron_external_interface (bond2 bond3). Traffic leaves through the
# neutron_bridge_name bridge, br-ex by default. The switch port must match
# the network type: access for flat, 802.1Q trunk for VLAN.

###############################################################################
# Octavia
###############################################################################
octavia_network_type: "provider"
octavia_amp_network_type: "vlan"
octavia_amp_network_provider_physical_network: "physnet2"
# octavia_network_interface must exist on EVERY host in the
# octavia-health-manager group. Missing on one host out of three gives load
# balancers that come up at random, depending on which HM received the heartbeat.

###############################################################################
# RabbitMQ
###############################################################################
om_enable_rabbitmq_stream_fanout: "yes"
# Set to the 2026.1 default on purpose rather than left implicit.
# With true, all stream leaders can end up on a single broker; check how they
# are distributed across the nodes after deploying.
