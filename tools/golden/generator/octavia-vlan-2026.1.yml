---
# Generated with Rackpathlabs globals.yml generator
#
# Plik konfiguracyjny Kolla-Ansible: /etc/kolla/globals.yml
# Docelowe wydanie: 2026.1   |   obraz bazowy: ubuntu
# Gazpacho, kolla-ansible 22.x, status wsparcia: maintained
#
# Zweryfikuj wartości na docelowych hostach przed uruchomieniem
# 'kolla-ansible prechecks' oraz 'kolla-ansible deploy'.

###############################################################################
# Obraz bazowy i wydanie
###############################################################################
kolla_base_distro: "ubuntu"
openstack_release: "2026.1"

###############################################################################
# Sieć
#
# network_interface           - sieć zarządzania / API, wymaga adresu IP na każdym węźle
# neutron_external_interface  - ruch zewnętrzny, interfejs bez adresu IP i bez konfiguracji
# kolla_internal_vip_address  - wolny adres w sieci zarządzania, nieprzypisany do hosta
###############################################################################
network_interface: "bond0.10"
neutron_external_interface: "bond2,bond3"
kolla_internal_vip_address: "10.40.0.250"
neutron_bridge_name: "br-ex,br-ex2"
api_interface: "bond0.10"
storage_interface: ""    # BŁĄD: wartość odrzucona, patrz Kontrola konfiguracji
migration_interface: ""    # BŁĄD: wartość odrzucona, patrz Kontrola konfiguracji
kolla_external_vip_address: "203.0.113.20"
kolla_external_vip_interface: "bond1"

###############################################################################
# Nazwy punktów końcowych i TLS
###############################################################################
kolla_internal_fqdn: "internal.cloud.example.net"
kolla_external_fqdn: "cloud.example.net"
kolla_enable_tls_internal: "yes"
kolla_copy_ca_into_containers: "yes"
kolla_enable_letsencrypt: "no"

###############################################################################
# Warstwa równoważenia obciążenia
###############################################################################
enable_haproxy: "yes"

###############################################################################
# Usługi OpenStack
###############################################################################
enable_cinder: "yes"
cinder_backend_ceph: "yes"
glance_backend_ceph: "yes"
# Kolla-Ansible nie wdraża Cepha. Klaster musi istnieć, a ceph.conf
# oraz keyringi trafiają do katalogu konfiguracji przed wdrożeniem.
enable_heat: "yes"
enable_horizon: "yes"
enable_barbican: "yes"
enable_octavia: "yes"
enable_prometheus: "yes"
enable_grafana: "yes"
enable_hacluster: "yes"
enable_masakari: "yes"
# Masakari bez działającego STONITH nie jest wysoką dostępnością. Izolacja
# sieciowa węzła wygląda jak jego awaria: instancja zostaje odtworzona,
# podczas gdy pierwotna wciąż trzyma otwarty deskryptor RBD.

###############################################################################
# Neutron
###############################################################################
neutron_plugin_agent: "ovn"
enable_neutron_provider_networks: "yes"
# Sieci provider mapują się bezpośrednio na sieć fizyczną podpiętą do
# neutron_external_interface (bond2 bond3). Ruch wychodzi przez mostek
# neutron_bridge_name — domyślnie br-ex. Port przełącznika musi być
# skonfigurowany zgodnie z typem sieci (dostępowy dla flat, trunk 802.1Q dla VLAN).

###############################################################################
# Octavia
###############################################################################
octavia_network_type: "provider"
octavia_amp_network_type: "vlan"
octavia_amp_network_provider_physical_network: "physnet2"
# octavia_network_interface musi istnieć na KAŻDYM hoście z grupy
# octavia-health-manager. Brak na jednym z trzech daje load balancery,
# które tworzą się losowo — zależnie od tego, który HM dostał puls.

###############################################################################
# RabbitMQ
###############################################################################
om_enable_rabbitmq_stream_fanout: "yes"
# Wartość domyślna wydania 2026.1, wypisana jawnie.
# Przy true liderzy wszystkich strumieni potrafią wylądować na jednym
# brokerze — po wdrożeniu zweryfikuj ich rozłożenie na węzłach.
