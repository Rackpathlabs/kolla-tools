# golden-release: 2026.1
# GROUP-NAME + GROUP-CUSTOM, NIEROZDZIELNE: "moja grupa!" nie przechodzi wzorca
# Ansible /^[A-Za-z0-9_.-]+$/ (spacja i wykrzyknik), wiec zawsze dostaje
# GROUP-NAME. Ta sama nazwa trafia potem do petli literowek/wlasnych grup —
# a nazwa spoza wzorca Ansible nigdy nie jest na liscie KNOWN (KNOWN to same
# poprawne nazwy Kolli), wiec petla musi ja zakwalifikowac jako TYPO albo jako
# GROUP-CUSTOM. Odleglosc Levenshteina od najblizszej znanej nazwy jest tu
# zbyt duza (dlugosc i tresc calkiem inne), wiec wypada GROUP-CUSTOM — ale
# gdyby literowka byla w dystansie <=2 od nazwy Kolli, ten sam mechanizm dalby
# TYPO zamiast tego. Para jest wlasnoscia kodu, nie wyborem tego przypadku.
[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03 ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.51

[mariadb:children]
control

[rabbitmq:children]
control

[ovn-database:children]
control

[ovn-northd:children]
ovn-database

[all:vars]
ansible_user=deploy
[moja grupa!:children]
control
