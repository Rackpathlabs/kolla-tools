# golden-release: 2026.1
# GROUP-CYCLE: mariadb i rabbitmq wciagaja sie nawzajem przez :children, tworzac
# cykl dlugosci dwa. Obie nazwy musza zostac na liscie KNOWN (Kolla) i zachowac
# swoj efektywny zbior hostow przez "control" — inaczej dolaczylyby sie
# GROUP-CUSTOM (nazwa spoza slownika) albo EMPTY-GROUP (pusty efektywny zbior).
# detectCycle zatrzymuje sie na pierwszym znalezionym cyklu (petla po "order"
# konczy sie "break"), wiec ten scenariusz moze pokazac wylacznie jeden cykl
# naraz.
[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03 ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.51

[mariadb:children]
control
rabbitmq

[rabbitmq:children]
control
mariadb

[ovn-database:children]
control

[ovn-northd:children]
ovn-database

[all:vars]
ansible_user=deploy
