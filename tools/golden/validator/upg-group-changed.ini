# golden-release: 2025.2
# golden-upgrade-to: 2026.1
# UPGRADE-GROUP-CHANGED: grupa cinder-volume, w 2026.1 oznaczona jako zmieniona
# okolicznosciami (kind: group, sev: info, brak replacedBy -> base + "-CHANGED").
# Waga 'info' w macierzy jest tym, co odroznia ten kod od UPGRADE-GROUP-RETIRED —
# nie tresc wpisu, tylko jego severity. Grupa musi WYSTEPOWAC w inventory, bo regula
# pomija wpisy, ktorych nie ma w plikach uzytkownika (`if (!groups[dep.name]) return;`).
# Bez globals.yml, wiec KV-07 i reszta regul dwuplikowych nie wchodzi w ogole.

