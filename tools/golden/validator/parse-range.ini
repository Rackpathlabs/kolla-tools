# golden-release: 2026.1
# RANGE: wzorzec zakresu, ktory Ansible odrzuci — [9:1] ma koniec mniejszy niz
# poczatek. Zly zakres siedzi na str03 (storage zostaje z dwoma hostami), nie
# na mon01: monitoring ma tylko jednego czlonka, wiec ten sam blad na mon01
# oproznilby cala grupe i dolozylby EMPTY-GROUP obok RANGE.
[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03[9:1] ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.51

[mariadb:children]
control

[rabbitmq:children]
control

[ovn-database:children]
control

[ovn-northd:children]
ovn-database

[all:vars]
ansible_user=deploy
