# golden-release: 2026.1
# GROUP-UNDEFINED: "nieistniejaca" wystepuje jako dziecko w [memcached:children],
# ale nigdzie nie jest zadeklarowana ani wciagana przez :children — nie ma wiec
# ani declaredAt, ani childrenAt, tylko referencedAt. Memcached musi zachowac
# drugie, ISTNIEJACE dziecko ("control"): gdyby "nieistniejaca" byla jedynym
# dzieckiem, efektywny zbior memcached bylby pusty i dolaczylby sie EMPTY-GROUP.
