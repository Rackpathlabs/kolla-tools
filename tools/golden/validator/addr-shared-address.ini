# golden-release: 2026.1
# SHARED-ADDRESS: mon01 i ctrl01 dzielą ten sam adres, ale na RÓŻNYCH portach.
# Regula rozroznia adres od punktu dostepu: ten sam adres z roznymi portami to
# poprawna topologia (NAT, lab zagniezdzony), wiec waga jest 'info'. Gdyby port
# byl ten sam, wczesniejsza regula zglosilaby DUPLICATE-ENDPOINT jako blad i ta
# zwrocilaby sie bez wpisu (warunek `if (conflicting) return;`), wiec ROZNY PORT
# jest tu warunkiem koniecznym, nie ozdoba.

[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03 ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.11 ansible_port=2222

[mariadb:children]
control

[rabbitmq:children]
