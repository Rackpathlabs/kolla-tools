# golden-release: 2026.1
# HOST-LIMIT + MISSING-GROUP x4, plik STANDALONE (nie kopia multinode-ok):
# 20480 hostow po rozwinieciu zakresow nie miesci sie w zadnym rozsadnym
# inventory obok pieciu grup wymaganych, wiec ten przypadek stoi sam, a
# control/network/storage/monitoring sa po prostu nieobecne — stad 4x MISSING-GROUP.
# Nazwy hostow niosa kropke CELOWO: bez niej kazdy z 20480 hostow bez
# ansible_host zapaliby tez NO-ADDRESS, a ten kod ma wlasny przypadek w
# pozniejszym commicie. Filtr `noAddr` w validator.html pomija kazda nazwe
# zawierajaca kropke (host.indexOf(".") === -1 jest warunkiem zaliczenia),
# wiec ".example" — dokumentacyjna domena RFC 2606, imienny odpowiednik
# adresow RFC 5737 uzywanych gdzie indziej w tym repozytorium — wylacza NO-ADDRESS
# bez wplywu na nic innego.
# Jedenascie linii to arytmetyczne minimum, nie wybor: [compute] plus dziesiec
# linii hostow. expandPattern rozwija jeden zakres na wzorzec, a MAX_RANGE
# = 2048, wiec przekroczenie MAX_HOSTS = 20000 wymaga dziesieciu linii hostow
# (9 x 2048 = 18432 to za malo, 10 x 2048 = 20480 przekracza limit na dziesiatej).

[compute]
host00[0001:2048].example
host01[0001:2048].example
host02[0001:2048].example
host03[0001:2048].example
host04[0001:2048].example
host05[0001:2048].example
host06[0001:2048].example
host07[0001:2048].example
host08[0001:2048].example
host09[0001:2048].example

