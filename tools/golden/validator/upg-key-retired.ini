# golden-release: 2025.2
# golden-upgrade-to: 2026.1
# UPGRADE-KEY-RETIRED: klucz distro_python_version, wycofany w 2026.1 bez zastapienia
# (kind: key, sev: warn, brak replacedBy -> upgradeCode sklada base + "-RETIRED").
# WYDANIE STARTOWE MUSI BYC WCZESNIEJSZE niz to, w ktorym klucz zniknal: upgradePath
# buduje sciezke petla `for (i = a - 1; i >= b; i--)`, czyli WYLACZA wydanie startowe.
# Sciezka 2025.1 -> 2026.1 z kluczem wycofanym W 2025.1 nie zapala wiec nic.
# cinder_cluster_name w towarzyszacym globals.yml WYCISZA KV-07: baza ma trzy hosty
# magazynu, a KV-07 zapala sie przy >1 hoscie bez tego klucza — bez niego kazdy
# scenariusz dwuplikowy na tej bazie mialby drugi finding, ktory nie jest jego tematem.

