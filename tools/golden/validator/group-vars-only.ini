# golden-release: 2026.1
# EMPTY-GROUP + GROUP-VARS-ONLY, NIEROZDZIELNE: [chrony:vars] nie deklaruje
# chrony ani nie wciaga do niej zadnego dziecka, wiec jej efektywny zbior jest
# pusty. Petla po "pozostalych pustych grupach" pomija grupe wylacznie wtedy,
# gdy nie ma ANI deklaracji, ANI dzieci, ANI sekcji :vars — a chrony ma sekcje
# :vars, wiec nie jest pomijana i EMPTY-GROUP zapala sie zawsze pierwsze.
# GROUP-VARS-ONLY dochodzi zaraz potem, z tej samej przyczyny (brak deklaracji
# i dzieci, obecnosc :vars). Gdyby ta sama sekcja siedziala na grupie, ktora MA
# hosty (np. [compute:vars]), nie zapaliloby sie nic z tej pary — grupa
# byłaby juz zadeklarowana.
[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03 ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.51

[mariadb:children]
control

[rabbitmq:children]
control

[ovn-database:children]
control

[ovn-northd:children]
ovn-database

[all:vars]
ansible_user=deploy
[chrony:vars]
foo=bar
