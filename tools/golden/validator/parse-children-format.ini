# golden-release: 2026.1
# CHILDREN-FORMAT: wpis w :children niosacy wiecej niz jeden token — Ansible
# czyta z takiej linii tylko pierwsze slowo jako nazwe dziecka, reszta to szum.
# Rodzic musi byc grupa, ktorej dziecko NIE tworzy kolokacji roli: [memcached]
# nie jest zadna z rol z reguly kolokacji, wiec wciagniecie "control" do niej
# konczy sie WYLACZNIE tym jednym kodem. [storage:children] compute extra
# zrobiloby to samo dla CHILDREN-FORMAT, ale storage przecinajace sie z compute
# zapala rowniez COLLOCATION-STORAGE (patrz "[storage] razem z [compute]" w
# validator.html) — dwa kody z jednej linii, wiec ten przypadek uzywa memcached.
[control]
ctrl01 ansible_host=10.10.0.11
ctrl02 ansible_host=10.10.0.12
ctrl03 ansible_host=10.10.0.13

[network]
net01 ansible_host=10.10.0.21
net02 ansible_host=10.10.0.22

[compute]
cmp01 ansible_host=10.10.0.31
cmp02 ansible_host=10.10.0.32

[storage]
str01 ansible_host=10.10.0.41
str02 ansible_host=10.10.0.42
str03 ansible_host=10.10.0.43

[monitoring]
mon01 ansible_host=10.10.0.51

[mariadb:children]
control

[rabbitmq:children]
control

[ovn-database:children]
control

[ovn-northd:children]
ovn-database

[all:vars]
ansible_user=deploy
[memcached:children]
control extra
