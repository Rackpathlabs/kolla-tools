name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Nowy push do gałęzi PR unieważnia poprzedni przebieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Twarda zasada repozytorium. Narzędzia są pojedynczymi plikami HTML
      # działającymi z file://; cokolwiek z npm w drzewie znaczy, że ktoś zaczął
      # budować to inaczej, niż brzmi obietnica produktu.
      - name: Zero zależności npm
        run: |
          bad=0
          for p in package.json package-lock.json yarn.lock pnpm-lock.yaml node_modules; do
            if [ -e "$p" ]; then echo "FAIL: w repo pojawiło się $p"; bad=1; fi
          done
          [ "$bad" -eq 0 ] && echo "OK   brak śladów npm"
          exit "$bad"

      # Osobne kroki, mimo że run-tests.sh uruchamia je ponownie: kosztują
      # milisekundy, a w interfejsie GitHuba od razu widać, co poszło źle.
      - name: Higiena plików (bajty NUL)
        run: bash tools/check-binary.sh

      - name: Słownik interfejsu (sieroty, puste wpisy)
        run: node tools/check-i18n.js

      # Osobno od powyższego, bo pyta o co innego: tamten sprawdza, czy klucz
      # ISTNIEJE i jest używany, ten — czy produkuje tekst NA EKRANIE. #59 przeszedł
      # tamten na zielono z pięćdziesięcioma pustymi elementami w generatorze.
      - name: Słownik — klucz produkuje tekst na ekranie
        run: node tools/check-i18n-apply.js

      # ZAPOBIEGA, w odróżnieniu od dwóch powyższych, które WYKRYWAJĄ: działa na kodzie,
      # więc nie ma pojęcia „scenariusz" i nie zależy od pokrycia. Powód rozdzielenia
      # jest w nagłówku pliku. Do 2026-08-19 nie wykonywał się w żadnym buildzie (#72).
      - name: Literały w ujściach tekstu
        run: node tools/check-literals.js

      - name: Spójność bloków współdzielonych
        run: bash tools/check-blocks.sh

      # SCOPE.md opisuje granice narzędzi. Jego zniknięcie albo utrata odnośnika
      # z README zmieniłaby obietnicę produktu bez śladu w review.
      - name: Dokument granic (SCOPE.md)
        run: bash tools/check-docs.sh

      # Zastępuje test przeglądarkowy z AC issue #4 — ten wymagałby npm.
      # Polityka CSP jest przypięta co do znaku, więc jej zmiana wywala build
      # i wymusza powtórzenie ręcznej weryfikacji w przeglądarce.
      - name: Gwarancja offline (CSP, API sieciowe, zasoby zewnętrzne)
        run: node tools/check-offline.js

      # Składnia (node --check), testy dymne i golden-file dla obu narzędzi.
      - name: Pełny zestaw testów
        run: bash tools/run-tests.sh

      # Progu pokrycia słownikiem (check-dictionary.js) NIE ma tu osobnym krokiem, choć
      # do 2026-08-19 nie wykonywał się nigdzie (#72). Wykonuje się w „Pełnym zestawie
      # testów", a osobny krok kosztowałby DRUGI pełny przebieg przeglądarki — podczas
      # gdy uzasadnienie osobnych kroków wypisane wyżej brzmi „kosztują milisekundy".
      # Odstępstwo trzyma się powodu tamtej reguły, a nie jej litery, i dlatego jest
      # zapisane tutaj zamiast przemilczane.

      # Kontrola mierzona na WYRENDEROWANEJ stronie, nie na jej reprezentacji.
      # Pasek nieaktualności walidatora miał ustawiony atrybut hidden i był widoczny:
      # .stale{display:flex} unieważniało [hidden]{display:none} z arkusza przeglądarki.
      # Sonda sprawdzająca obecność atrybutu odpowiadała "ukryty" — na inne pytanie
      # niż zadane. Chrome jest w obrazie runnera, więc silnik układu graficznego
      # kosztuje nas zero i nie wymaga npm.
      - name: Widoczność mierzona w przeglądarce
        run: node tools/check-rendered.js

      # Komparator upstreamu żyje w osobnym workflow, ale jego dowód poprawności
      # należy tutaj: gdyby psuł się tylko w cotygodniowym cronie, dowiedzielibyśmy
      # się o tym z braku alarmu, czyli dokładnie tak, jak się nie da.
      # Sam test nie rusza sieci — podstawia zafałszowaną macierz z pamięci.
      - name: Komparator upstreamu wykrywa rozjazd
        run: python3 tools/upstream_watch.py --self-test
