name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Nowy push do gałęzi PR unieważnia poprzedni przebieg.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: testy
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0, bo krok „Słowo-klucz zamykające" liczy zakres commitów PR-a
      # przez git merge-base. Domyślna płytka kopia daje pusty zakres, a pusty zakres
      # wyglądałby jak czysty wynik — strażnik odmawia wtedy przejścia, ale lepiej
      # nie stawiać go w tej sytuacji w ogóle.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Twarda zasada repozytorium. Narzędzia są pojedynczymi plikami HTML
      # działającymi z file://; cokolwiek z npm w drzewie znaczy, że ktoś zaczął
      # budować to inaczej, niż brzmi obietnica produktu.
      #
      # Do 2026-08-20 stała tu pętla po PIĘCIU ŚCIEŻKACH W KORZENIU i tools/package.json
      # przechodził przez nią bez słowa. Teraz plik, bo krok w YAML-u nie może mieć
      # fixtury, a strażnik bez fixtury to dokładnie to, co usuwało #96.
      - name: Zero zależności npm
        run: node tools/check-npm.js

      # Osobne kroki, mimo że run-tests.sh uruchamia je ponownie: kosztują
      # milisekundy, a w interfejsie GitHuba od razu widać, co poszło źle.
      - name: Higiena plików (bajty NUL)
        run: bash tools/check-binary.sh

      - name: Słownik interfejsu (sieroty, puste wpisy)
        run: node tools/check-i18n.js

      # Osobno od powyższego, bo pyta o co innego: tamten sprawdza, czy klucz
      # ISTNIEJE i jest używany, ten — czy produkuje tekst NA EKRANIE. #59 przeszedł
      # tamten na zielono z pięćdziesięcioma pustymi elementami w generatorze.
      - name: Słownik — klucz produkuje tekst na ekranie
        run: node tools/check-i18n-apply.js

      # DWIE POWIERZCHNIE, JEDNA REGUŁA. GitHub zamyka issues ze słowa-klucza w opisie
      # PR-a ORAZ z komunikatów commitów trafiających na gałąź domyślną. To repozytorium
      # ma włączone wszystkie trzy strategie merge'a i faktycznie merguje przez merge
      # commit, więc komunikaty pojedynczych commitów lądują na main.
      #
      # Powierzchnia commitowa jest tu NIEUDOWODNIONA, a nie obalona: wszystkie osiem
      # zamkniętych issue ma commit_id=null, ale słowo-klucz stał za każdym razem w obu
      # miejscach naraz, więc historia nie rozstrzyga. Obejmujemy ją świadomie —
      # strażnik pilnujący jednej powierzchni daje poczucie osłony bez osłony.
      #
      # Tylko na pull_request: przy push na main nie ma czego chronić, bo merge już
      # zaszedł. Krok jest wtedy JAWNIE pominięty, a nie cicho zielony.
      - name: Słowo-klucz zamykające obok numeru issue; personalia na liście
        if: github.event_name == 'pull_request'
        env:
          # Przez zmienną środowiskową, nie przez podstawienie do skryptu: treść opisu
          # i tytułu PR-a jest wejściem od użytkownika i nie ma prawa trafić do powłoki
          # jako kod.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # TYTUŁ jest trzecią powierzchnią, z OSTRZEJSZĄ regułą — zakaz blankietowy
          # zamiast „całej linii". Nie dlatego, że GitHub parsuje pole tytułu (jego
          # dokumentacja wymienia opis PR-a i komunikat commita, tytułu nie), tylko
          # dlatego, że konfiguracja merge'a tego repozytorium KOPIUJE tytuł do
          # komunikatu commita: squash_merge_commit_title=COMMIT_OR_PR_TITLE oraz
          # merge_commit_message=PR_TITLE. Commit 0fd2f9e na main jest dowodem —
          # niesie tytuł PR#52 razem ze słowem-kluczem obok numeru.
          printf '%s' "$PR_TITLE" > .pr-title.tmp
          # body bywa null w payloadzie — wtedy plik jest pusty, a strażnik mówi o tym
          # wprost zamiast milczeć. Bez :- krok padłby na unbound variable. Tytuł
          # takiego domyślnika NIE dostaje: PR bez tytułu nie istnieje, więc pusty
          # znaczyłby awarię kroku, nie legalny stan.
          printf '%s' "${PR_BODY:-}" > .pr-body.tmp
          # merge-base, nie base.sha wprost: main mógł się przesunąć od otwarcia PR-a,
          # a wtedy zakres wciągnąłby cudze commity i strażnik mówiłby o nie swoim tekście.
          MB="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git log --no-merges --format='%B%n' "$MB..$HEAD_SHA" > .commits.tmp
          echo "zakres: $MB..$HEAD_SHA  ($(git rev-list --no-merges --count "$MB..$HEAD_SHA") commitów)"
          node tools/check-closing-keyword.js --pr-title .pr-title.tmp \
                                              --pr-body .pr-body.tmp \
                                              --commits .commits.tmp
          # Ta sama trójka plików, drugi strażnik, INNE PYTANIE. Tamten pyta o KSZTAŁT
          # (konstrukcja zakazana niezależnie od treści), ten o TREŚĆ wobec zamkniętej
          # listy skrótów. Powód rozdzielenia stoi w nagłówku tools/check-personal-names.js.
          # Krok jest wspólny, bo zakres commitów liczy się raz — merge-base nie ma powodu
          # być liczony dwa razy, a dwa kroki musiałyby go powtórzyć albo współdzielić plik
          # między krokami, co jest gorsze od wspólnego kroku.
          node tools/check-personal-names.js --pr-title .pr-title.tmp \
                                             --pr-body .pr-body.tmp \
                                             --commits .commits.tmp

      # Pytanie warunkujące sens pozostałych kroków: czy zestaw strażników jest
      # kompletny. Reguła „strażnik ma się wykonywać w buildzie" powstała po #72
      # i do #98 nie miała żadnej egzekucji — pilnowała jej czyjaś pamięć.
      - name: Wpięcie strażników w build
        run: node tools/check-wiring.js

      # RÓWNOŚĆ, nie pokrycie. Jedyna kontrola tekstu w tym repozytorium, która NIE
      # zależy od pokrycia scenariuszami: porównuje dwa napisy leżące obok siebie
      # w plikach. Powstała czerwona przed migracją z ADR-002 (108 pustych elementów).
      - name: Markup kontra słownik
        run: node tools/check-markup-dict.js

      # ZAPOBIEGA, w odróżnieniu od dwóch powyższych, które WYKRYWAJĄ: działa na kodzie,
      # więc nie ma pojęcia „scenariusz" i nie zależy od pokrycia. Powód rozdzielenia
      # jest w nagłówku pliku. Do 2026-08-19 nie wykonywał się w żadnym buildzie (#72).
      - name: Literały w ujściach tekstu
        run: node tools/check-literals.js

      - name: Spójność bloków współdzielonych
        run: bash tools/check-blocks.sh

      # SCOPE.md opisuje granice narzędzi. Jego zniknięcie albo utrata odnośnika
      # z README zmieniłaby obietnicę produktu bez śladu w review.
      - name: Dokument granic (SCOPE.md)
        run: bash tools/check-docs.sh

      # Zastępuje test przeglądarkowy z AC issue #4 — ten wymagałby npm.
      # Polityka CSP jest przypięta co do znaku, więc jej zmiana wywala build
      # i wymusza powtórzenie ręcznej weryfikacji w przeglądarce.
      - name: Gwarancja offline (CSP, API sieciowe, zasoby zewnętrzne)
        run: node tools/check-offline.js

      # Składnia (node --check), testy dymne i golden-file dla obu narzędzi.
      - name: Pełny zestaw testów
        run: bash tools/run-tests.sh

      # Progu pokrycia słownikiem (check-dictionary.js) NIE ma tu osobnym krokiem, choć
      # do 2026-08-19 nie wykonywał się nigdzie (#72). Wykonuje się w „Pełnym zestawie
      # testów", a osobny krok kosztowałby DRUGI pełny przebieg przeglądarki — podczas
      # gdy uzasadnienie osobnych kroków wypisane wyżej brzmi „kosztują milisekundy".
      # Odstępstwo trzyma się powodu tamtej reguły, a nie jej litery, i dlatego jest
      # zapisane tutaj zamiast przemilczane.

      # Kontrola mierzona na WYRENDEROWANEJ stronie, nie na jej reprezentacji.
      # Pasek nieaktualności walidatora miał ustawiony atrybut hidden i był widoczny:
      # .stale{display:flex} unieważniało [hidden]{display:none} z arkusza przeglądarki.
      # Sonda sprawdzająca obecność atrybutu odpowiadała "ukryty" — na inne pytanie
      # niż zadane. Chrome jest w obrazie runnera, więc silnik układu graficznego
      # kosztuje nas zero i nie wymaga npm.
      - name: Widoczność mierzona w przeglądarce
        run: node tools/check-rendered.js

      # SKUTEK, nie źródło. check-offline.js czyta listę sześciu nazw i przepuszcza
      # wywołania, które nie wyglądają na wywołania (#101, ADR-003 opcja D). Ten
      # uruchamia te same scenariusze co krok wyżej i patrzy, co faktycznie wyszło.
      - name: Żądania sieciowe na wykonanych scenariuszach
        run: node tools/check-network.js

      # Komparator upstreamu żyje w osobnym workflow, ale jego dowód poprawności
      # należy tutaj: gdyby psuł się tylko w cotygodniowym cronie, dowiedzielibyśmy
      # się o tym z braku alarmu, czyli dokładnie tak, jak się nie da.
      # Sam test nie rusza sieci — podstawia zafałszowaną macierz z pamięci.
      - name: Komparator upstreamu wykrywa rozjazd
        run: python3 tools/upstream_watch.py --self-test
