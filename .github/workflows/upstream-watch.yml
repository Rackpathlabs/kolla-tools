name: upstream-watch

# Osobny workflow, NIE część ci.yml. CI zostaje bez dostępu do sieci — artefakty
# HTML mają być zero-network, a CSP przypięta co do znaku. Sieć żyje wyłącznie tutaj.
#
# OpenStack wydaje dwie serie rocznie, więc cotygodniowe sprawdzanie to nadgorliwość.
# Kosztuje zero i jest jedynym sposobem, żeby rozjazd nie leżał odłogiem przez pół roku.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# JEDEN PRZEBIEG NARAZ. Cron i workflow_dispatch mogą się nałożyć, a wtedy oba przebiegi
# szukają swojego zgłoszenia, oba nic nie znajdują i oba je zakładają — objaw identyczny
# jak przy filtrze `--state open` (#90). Dwie przyczyny o jednym objawie muszą być zamknięte
# razem, inaczej duplikat po naprawie filtru czyta się jako „naprawa nie zadziałała".
#
# cancel-in-progress: false, nie true. Przebieg przerwany w połowie zostawia wypchniętą
# gałąź bez zgłoszenia, które mówi, co z nią zrobić — czyli ciszę w miejscu, w którym ma
# być raport. Kolejkowanie kosztuje minuty raz w tygodniu.
concurrency:
  group: upstream-watch
  cancel-in-progress: false

# pull-requests: świadomie BRAK. Repozytorium ma wyłączone "Allow GitHub Actions
# to create and approve pull requests", a GitHub wiąże tworzenie i zatwierdzanie
# w jednym przełączniku — nie da się dać samego tworzenia. Bramką ma być człowiek,
# więc bot nie powinien mieć technicznej możliwości bycia bramką, nawet nieużywanej.
# Uprawnienie zostaje w repo na stałe i przeżyje każdego, kto pamięta, po co je
# włączono; "żaden nasz workflow tego nie robi" jest twierdzeniem o dziś.
#
# Zamiast PR-a: watcher pushuje gałąź i zakłada zgłoszenie z gotową komendą.
permissions:
  contents: write
  issues: write

jobs:
  watch:
    name: porównanie z upstreamem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TOŻSAMOŚĆ ZGŁOSZEŃ WATCHERA LEŻY W ETYKIETACH, więc etykiety muszą istnieć zanim
      # cokolwiek ich poszuka. Zakładane tutaj, a nie ręcznie w interfejsie, z tego samego
      # powodu, dla którego `.claude/settings.json` jest wersjonowany: mechanizm, który
      # zależy od kroku wykonanego kiedyś przez człowieka, w świeżym klonie nie istnieje.
      #
      # --force jest idempotentne: aktualizuje istniejącą etykietę zamiast się wywalić.
      - name: Etykiety tożsamości watchera
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create watcher:release-notes --color BFD4F2 --force \
            --description "Zgłoszenie prowadzone przez upstream-watch: kandydaci z release notes"
          gh label create watcher:drift --color BFD4F2 --force \
            --description "Zgłoszenie prowadzone przez upstream-watch: rozjazd macierzy"
          gh label create watcher:series --color BFD4F2 --force \
            --description "Zgłoszenie prowadzone przez upstream-watch: nowa seria do przeglądu"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Instalujemy wprost, zamiast liczyć na to, co akurat jest w obrazie runnera.
      # Domyślność, na której nikt nie sprawdził, że obowiązuje, to nie jest założenie
      # — to jest zgadywanie.
      - name: PyYAML
        run: python3 -m pip install --quiet PyYAML

      # Bramka przed czymkolwiek innym: komparator musi udowodnić, że wykrywa
      # rozjazd, zanim uwierzymy w jego "brak rozjazdu". Bez sieci.
      - name: Komparator wykrywa rozjazd
        run: python3 tools/upstream_watch.py --self-test

      - name: Porównanie z upstreamem
        id: compare
        run: |
          # Bez potoku: za potokiem $? jest statusem tee, czyli zawsze zerem,
          # a wtedy krok tworzący PR nigdy by się nie odpalił.
          set +e
          python3 tools/upstream_watch.py > /tmp/report.txt 2>&1
          rc=$?
          cat /tmp/report.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ] || exit "$rc"

      - name: Naniesienie zmian mechanicznych
        if: steps.compare.outputs.rc == '1'
        run: |
          python3 tools/upstream_watch.py --apply | tee /tmp/applied.txt
          bash tools/sync-blocks.sh
          bash tools/check-blocks.sh

      # Gałąź, nie PR. Otwarcie PR-a to jedno wklejenie linijki dwa razy do roku,
      # przy zmianie, którą i tak trzeba przeczytać — a alternatywą byłoby stałe
      # uprawnienie bota do zatwierdzania PR-ów. Asymetria jest jednoznaczna.
      #
      # Gałąź dotyka wyłącznie matrix.js plus bloków przepisanych przez
      # sync-blocks.sh — nigdy edycji bloku w miejscu.
      - name: Gałąź ze zmianami mechanicznymi
        id: branch
        if: steps.compare.outputs.rc == '1'
        run: |
          if git diff --quiet; then
            echo "brak zmian mechanicznych do naniesienia"; exit 0
          fi
          BR="upstream-watch/$(date +%Y-%m-%d)"
          git config user.name "upstream-watch"
          git config user.email "noreply@github.com"
          git checkout -b "$BR"
          git add matrix.js generator.html validator.html
          {
            echo "Sync release matrix with upstream series status"
            echo
            cat /tmp/applied.txt
            echo
            echo "Generated by tools/upstream_watch.py. Only status and date fields of"
            echo "existing series are patched; anything touching deprecated[] or keys{}"
            echo "is left for review."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BR"
          echo "name=$BR" >> "$GITHUB_OUTPUT"

      - name: Zgłoszenie z gotową komendą
        if: steps.branch.outputs.name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ steps.branch.outputs.name }}
        run: |
          TITLE="Upstream drift on branch $BR — open the PR"

          # Treść przez heredoc do pliku, nie przez printf z zagnieżdżonymi
          # cudzysłowami. Komenda w treści sama zawiera cudzysłowy i backticki,
          # a printf, w którym trzeba je uciekać, psuje się po cichu — czego
          # dowodzi ten workflow dwa commity wstecz.
          cat > /tmp/issue-body.md <<EOF
          Watcher naniósł zmiany mechaniczne i wypchnął gałąź \`$BR\`.

          PR-a zakłada człowiek. Bot celowo nie ma uprawnienia do tworzenia ani
          zatwierdzania PR-ów: GitHub wiąże jedno z drugim w tym samym przełączniku,
          a bramką ma być człowiek — więc bot nie powinien mieć technicznej
          możliwości bycia bramką, nawet nieużywanej.

          Do wklejenia:

          \`\`\`bash
          gh pr create --draft --base main --head $BR \\
            --title "Sync release matrix with upstream" \\
            --body "Mechanical sync generated by tools/upstream_watch.py. Statuses and dates only; anything touching deprecated[] or keys{} was left for review."
          \`\`\`

          Naniesione:

          \`\`\`
          $(cat /tmp/applied.txt)
          \`\`\`

          Pełny raport:

          \`\`\`
          $(cat /tmp/report.txt)
          \`\`\`

          _Treść tego zgłoszenia jest nadpisywana przy każdym przebiegu._
          EOF
          # Wcięcie z bloku YAML-a trzeba zdjąć — inaczej wszystko byłoby blokiem kodu.
          sed -i 's/^          //' /tmp/issue-body.md

          # TOŻSAMOŚĆ PO ETYKIECIE, ale PODMIOTEM jest GAŁĄŹ, nie temat (#90).
          #
          # Ten sam wzorzec co w bloku not wydania — etykieta plus `--state all`, przez
          # listowanie — z jedną różnicą, którą trzeba wypisać, bo inaczej wygląda na
          # niekonsekwencję: tam jedno zgłoszenie żyje wiecznie, tutaj każda gałąź jest
          # osobnym podmiotem. Nadpisanie treści zgłoszenia o gałęzi A komendą dla gałęzi B
          # skasowałoby jedyny ślad tego, co zrobić z A.
          #
          # Gdy poprzednie zgłoszenie watchera dotyczy INNEJ gałęzi, zakładamy nowe
          # Z ODWOŁANIEM do tamtego — to jest druga z dwóch dozwolonych odpowiedzi
          # z kryterium 2 w #90, wybrana świadomie, a nie z przeoczenia.
          PREV="$(gh issue list --state all --label watcher:drift --limit 200 \
                    --json number,title --jq '.[0] | "\(.number)\t\(.title)"')"
          PNUM="${PREV%%$'\t'*}"; PTITLE="${PREV#*$'\t'}"
          if [ -n "$PNUM" ] && [ "$PTITLE" = "$TITLE" ]; then
            # Ta sama gałąź: to jest to samo zgłoszenie, niezależnie od stanu.
            STATE="$(gh issue view "$PNUM" --json state --jq .state)"
            if [ "$STATE" = "CLOSED" ]; then
              gh issue reopen "$PNUM" --comment "Otworzone ponownie przez \`upstream-watch\`: gałąź \`$BR\` nadal czeka na PR-a."
            fi
            gh issue edit "$PNUM" --body-file /tmp/issue-body.md
          else
            if [ -n "$PNUM" ]; then
              printf '\n---\n\nPoprzednie zgłoszenie watchera o rozjeździe: #%s (inna gałąź, więc osobny podmiot — nie nadpisujemy go).\n' "$PNUM" >> /tmp/issue-body.md
            fi
            gh issue create --title "$TITLE" --label "watcher:drift,area:repo,p2" \
              --body-file /tmp/issue-body.md
          fi

      # Klasa 2, część ciągła: nowe noty wydania wymieniające nazwę, którą macierz
      # zna. Jedno issue o stałym tytule, którego treść jest NADPISYWANA, a nie
      # komentowana — cotygodniowy komentarz z tą samą listą uczy ludzi przewijać
      # powiadomienia bez czytania.
      - name: Kandydaci z release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 tools/upstream_watch.py --notes > /tmp/notes.txt 2>&1
          rc=$?
          cat /tmp/notes.txt
          # rc=0 to brak kandydatów, rc=1 to kandydaci, cokolwiek wyżej to awaria
          # skanera — i ma być widoczna, a nie połknięta jako "nic nie znaleziono".
          [ "$rc" -le 1 ] || exit "$rc"
          [ "$rc" -eq 1 ] || exit 0

          TITLE="Upstream release notes: candidates for the matrix"
          BODY="$(printf 'Noty wydania nowe w najświeższej serii, wymieniające nazwę, którą zna `matrix.js`. Słowa kluczowe pochodzą z macierzy, nie z listy w kodzie.\n\n**Cytaty są surowe.** Skrypt nie przypisuje `kind` ani `sev` — to wymaga przeczytania noty ze zrozumieniem, a zgadnięta klasyfikacja trafiłaby do reguł, o których ktoś potem założy, że ktoś je sprawdził.\n\n```\n%s\n```\n\n_Treść tego zgłoszenia jest nadpisywana przy każdym przebiegu._\n' "$(cat /tmp/notes.txt)")"

          # TOŻSAMOŚĆ PO ETYKIECIE, NIE PO TYTULE I STANIE (#90).
          #
          # Do 2026-09-02 blok szukał `--state open` i dokładnego tytułu. Zamknięcie tematu
          # sprawiało, że przy najbliższym przebiegu nie znajdował nic i zakładał duplikat —
          # a przebieg kończył się sukcesem, więc nikt tego nie widział. Trzy kopie w tym
          # repozytorium (#41, #43, #45), każda 27 sekund po zamknięciu poprzedniej.
          #
          # Tytuł plus stan nie jest tożsamością: pierwsze jest tekstem dla ludzi i będzie
          # redagowane, drugie zmienia człowiek w toku normalnej pracy. Etykieta przeżywa
          # oba i jest widoczna w interfejsie — widać, które zgłoszenie należy do watchera,
          # i widać, gdy ktoś ją zdejmie.
          #
          # NIE UŻYWAJ `gh issue list --search "... in:title"` DO SZUKANIA PO TYTULE.
          # Zawodzi z dwóch NIEZALEŻNYCH powodów, więc naprawienie jednego nie
          # wystarczy i obie awarie wyglądają tak samo: "nie znaleziono".
          #   1. Dwukropek w tytule rozbija składnię kwalifikatorów wyszukiwania.
          #      Tytuły tutaj mają dwukropek, bo tak się je czyta.
          #   2. Indeks wyszukiwania jest opóźniony o minuty względem zakładania
          #      zgłoszeń. Nawet poprawne zapytanie nie widzi świeżego wpisu.
          # Skutek w produkcji: przebieg założył drugą kopię tego samego zgłoszenia.
          # Zwykła lista plus dokładne porównanie tytułu nie ma żadnej z tych cech.
          # --state all, bo stan NIE jest częścią tożsamości. Filtr przez listowanie
          # z etykietą, nigdy przez wyszukiwarkę — powody wyżej.
          FOUND="$(gh issue list --state all --label watcher:release-notes --limit 200 \
                     --json number,state --jq '.[0] | "\(.number) \(.state)"')"
          NUM="${FOUND%% *}"; STATE="${FOUND##* }"
          if [ -n "$NUM" ]; then
            # SEMANTYKA TRAFIENIA W ZGŁOSZENIE ZAMKNIĘTE JEST JAWNA (#90, kryterium 2).
            # Ciche `gh issue edit` na zamkniętym zgłoszeniu jest TĄ SAMĄ awarią co duplikat,
            # tylko cichszą: raport powstaje, jest aktualny i jest niewidoczny — nie pojawia
            # się na liście, nie generuje powiadomienia i wygląda jak zgłoszenie, którym ktoś
            # się zajął. Duplikat przynajmniej widać.
            if [ "$STATE" = "CLOSED" ]; then
              gh issue reopen "$NUM" --comment "Otworzone ponownie przez \`upstream-watch\`: skaner not wydania znalazł kandydatów po tym, jak zgłoszenie zamknięto. Treść poniżej jest nadpisywana przy każdym przebiegu; jeśli temat jest naprawdę zamknięty, zdejmij etykietę \`watcher:release-notes\` — wtedy watcher założy nowe zgłoszenie zamiast wracać do tego."
            fi
            gh issue edit "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" \
              --label "watcher:release-notes,area:repo,p3" --body "$BODY"
          fi

      # Klasa 2: nowa seria oraz cokolwiek dotykającego semantyki reguł. Skrypt
      # świadomie się tu zatrzymuje — klasyfikacja kind/sev i treść noty to nie jest
      # coś, co da się zgadnąć z release notes bez czytania ich ze zrozumieniem.
      - name: Issue dla zmian wymagających przeglądu
        if: steps.compare.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SERIES="$(awk '$1=="DRIFT" && $3=="presence" {print $2}' /tmp/report.txt | paste -sd, -)"
          if [ -z "$SERIES" ]; then
            echo "brak zmian klasy 2"; exit 0
          fi
          # Tytuł niesie nazwę serii, więc cotygodniowy przebieg nie zakłada
          # dziesiątego zgłoszenia o tym samym, dopóki nikt się nim nie zajmie.
          TITLE="Upstream: new OpenStack series $SERIES needs a ruleset review"
          # Ten sam wzorzec tożsamości co w dwóch blokach wyżej: etykieta plus `--state all`,
          # przez listowanie. Etykieta odpowiada na pytanie „czy to zgłoszenie watchera",
          # tytuł na pytanie „której serii dotyczy" — bo tu podmiotem jest SERIA i nowa seria
          # ma dostać własne zgłoszenie.
          #
          # GRANICA, nazwana zamiast przemilczanej: przeredagowanie tytułu przez człowieka
          # sprawi, że watcher założy dla tej serii drugie zgłoszenie. Etykieta zawęża
          # listę, więc duplikat będzie widoczny pod nią od razu — a nie osieroci wszystkich
          # pozostałych, bo tożsamość pozostałych nie zależy od tego tytułu.
          if gh issue list --state all --label watcher:series --limit 200 --json title \
               --jq ".[] | select(.title == \"$TITLE\")" | grep -q .; then
            echo "zgłoszenie dla $SERIES już istnieje"; exit 0
          fi
          gh issue create --title "$TITLE" \
            --label "watcher:series,area:repo,p2" \
            --body "$(printf 'Watcher wykrył serię obecną w upstreamie, a nieobecną w macierzy.\n\n```\n%s\n```\n\nSzkieletowy wiersz może dopisać automat, ale **katalog deprecacji zostaje dla człowieka**: `deprecationsCatalogued: false` znaczy „nie wiemy", a nie „nic się nie zmieniło", więc tryb aktualizacji zgłosi jawną lukę zamiast milczeć.\n\nDo przejrzenia przy okazji:\n\n- [ ] `deprecated[]` z release notes nowej serii\n- [ ] `keys{}` — nowe flagi i zmiany wartości domyślnych\n- [ ] `baseDistros` i `hostOs` z support matrix (RST, świadomie nieautomatyzowane)\n- [ ] `kolla` — seria kolla-ansible odpowiadająca wydaniu\n' "$(cat /tmp/report.txt)")"
